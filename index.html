   <tr>${th('Módulo · proceso')}${th('Sesiones')}${th('Repeticiones')}${th('Responsable')}${th('Estado')}`;
  DIAS.forEach(d=>{const o=d3(d); x+=`<td style="${st}font-weight:bold;color:#FFFFFF;background:#1F3864;text-align:center;width:26px">${o.getDate()}<br>${WD[o.getDay()]}</td>`});
  x+='</tr>';
  L.forEach((m,i)=>{
    const P=m.pract||{}, ses=m.sesiones, nr=nReps(m), nc=nCasos(m);
    const ej=ses.filter(s=>s.estado==='Ejecutada').length;
    const bg=i%2? '#F2F2F2':'#FFFFFF';

    x+=`<tr>
      <td bgcolor="${bg}" style="${st}background:${bg}">${esc(m.modulo)} · ${esc(m.proceso)}</td>
      <td bgcolor="${bg}" style="${st}background:${bg};text-align:center">${ej}/${ses.length}</td>
      <td bgcolor="${bg}" style="${st}background:${bg};text-align:center">${nr? nc+'/'+nr : '—'}</td>

  const b=new Blob(['﻿'+x],{type:'application/vnd.ms-excel;charset=utf-8'});

}

/* ================= BITÁCORA DESCARGABLE ================= */
function bajarBitacora(pf){
  const m=MODS.find(x=>x.pf===pf);
  const H=['No.','Fecha','Línea de producto','Tipo de orden (captura manual)','No. de orden QAD','Cliente',
           'Código de producto','Descripción del producto','No. de orden / cotización en Odoo','Observaciones de la prueba'];
  const W=[46,86,168,190,128,180,128,236,152,470];
  const st='font-family:Arial;font-size:9pt;border:.5pt solid #BFBFBF;vertical-align:top;';
  const meta=[['Módulo / proceso',m.proceso],['Empresa',m.empresa],['Clave de PF',m.pf],
    ['Consultor que conduce',m.ficha.consultor||'Por designar'],
    ['Responsable del módulo',m.ficha.responsable||''],
    ['Responsable del área en las prácticas',(m.pract||{}).resp||''],
    ['Repeticiones a realizar',String((m.pract||{}).reps||'')],
    ['Ventana de prácticas',(m.pract||{}).r0? fmt(m.pract.r0)+' al '+fmt(m.pract.r1):''],
    ['Cierre y firma',(m.pract||{}).cierre? fmt(m.pract.cierre):''],
    ['Practicante que ejecuta la prueba','']];
  let h=`<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="utf-8">
   <!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet>
   <x:Name>Bitácora de casos</x:Name><x:WorksheetOptions><x:DisplayGridlines/></x:WorksheetOptions>
   </x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]--></head><body>
   <table border="0" cellspacing="0">
   <tr><td colspan="10" style="font-family:Arial;font-size:12pt;font-weight:bold;color:#FFFFFF;background:#1F3864;height:24px">
     PROYECTO ALPHA · Bitácora de casos de Prueba Funcional — ${esc(m.proceso)}</td></tr>
   <tr><td colspan="10" style="font-family:Arial;font-size:9pt;font-style:italic;color:#595959">
     Un renglón por caso. Registra la orden que ya existe en QAD y su réplica en Odoo 18. «Tipo de orden» se captura a mano (Fabricación, Muestras, Pruebas…): en QAD no es campo de selección. Línea de producto: ${LP.join(' · ')}. La fila de ejemplo está para borrarse. · Generada el ${fmt(hoyISO())}</td></tr>
   <tr><td colspan="10"></td></tr>`;
  for(let i=0;i<meta.length;i+=3){
    h+='<tr>';
    meta.slice(i,i+3).forEach(([k,v])=>{
      h+=`<td style="${st}font-weight:bold;color:#FFFFFF;background:#7F7F7F">${esc(k)}</td>
          <td colspan="2" style="${st}font-weight:bold;background:${v?'#F2F2F2':'#FFF2CC'}">${esc(v)}</td>`});
    h+='</tr>';
  }
  h+=`<tr><td colspan="10"></td></tr><tr>`;
  H.forEach((t,j)=>h+=`<td style="${st}font-weight:bold;color:#FFFFFF;background:#1F3864;text-align:center;width:${W[j]}px">${esc(t)}</td>`);
  h+='</tr>';
  const CAS=[];   /* la bitácora se descarga en blanco: el área la llena fuera del tablero */
  if(CAS.length){
    CAS.forEach((c,i)=>{
      const v=[String(i+1),c.fecha?fmt(c.fecha):'',c.linea||'',c.tipo||'',c.qad||'',c.cliente||'',
               c.codigo||'',c.desc||'',c.odoo||'',c.obs||''];
      h+='<tr>'+v.map(x=>`<td style="${st}">${esc(x)}</td>`).join('')+'</tr>';
    });
  } else {
    const ej=['1','18-08-26','Tarjetas financieras','Fabricación','SO-QAD-104582','BANAMEX, S.A.','TJ-EMV-0451',
      'Tarjeta EMV dual Banamex Oro','S00187','Ejemplo — bórralo. La orden se replicó completa hasta la OF. El producto existe pero sin precio de venta ni BOM.'];
    h+='<tr>'+ej.map(v=>`<td style="${st}color:#808080;font-style:italic">${esc(v)}</td>`).join('')+'</tr>';
  }
  const libres=Math.max(12,((m.pract||{}).reps||0)+4);
  for(let i=0;i<libres;i++) h+='<tr>'+H.map(()=>`<td style="${st}height:26px"></td>`).join('')+'</tr>';
  /* --- faltantes detectados --- */
  const HF=['No. de caso','Tipo de faltante','Elemento afectado','Descripción del faltante','¿Bloquea la prueba?','Área responsable','Estatus','Fecha de solución'];
  const WF=[86,168,200,470,110,180,110,130];
  h+=`<tr><td colspan="10"></td></tr>
   <tr><td colspan="10" style="font-family:Arial;font-size:11pt;font-weight:bold;color:#FFFFFF;background:#1F3864;height:22px">
     &nbsp;FALTANTES DETECTADOS</td></tr>
   <tr><td colspan="10" style="font-family:Arial;font-size:9pt;font-style:italic;color:#595959">
     Todo lo que impidió o cambió el resultado de un caso. Un faltante bloquea cuando impide terminar la prueba. La guía no se firma con faltantes bloqueantes abiertos.</td></tr><tr>`;
  HF.forEach((t,j)=>h+=`<td style="${st}font-weight:bold;color:#FFFFFF;background:#7F7F7F;text-align:center;width:${WF[j]}px">${esc(t)}</td>`);
  h+=`<td colspan="2"></td></tr>`;
  const FAL=m.faltantes||[];
  if(FAL.length) FAL.forEach(f=>{
    const bl=f.bloquea==='Sí' && f.estatus!=='Resuelto';
    const v=[String(f.caso||''),f.tipo||'',f.elem||'',f.desc||'',f.bloquea||'',f.area||'',f.estatus||'',f.fsol?fmt(f.fsol):''];
    h+='<tr>'+v.map(x=>`<td bgcolor="${bl?'#FCE4E4':'#FFFFFF'}" style="${st}background:${bl?'#FCE4E4':'#FFFFFF'}">${esc(x)}</td>`).join('')+'<td colspan="2"></td></tr>';
  });
  for(let i=0;i<10;i++) h+='<tr>'+HF.map(()=>`<td style="${st}height:26px"></td>`).join('')+'<td colspan="2"></td></tr>';
  h+='</table></body></html>';
  const b=new Blob(['﻿'+h],{type:'application/vnd.ms-excel;charset=utf-8'});
  const u=URL.createObjectURL(b), a=document.createElement('a');
  a.href=u; a.download=`Bitacora_PF_${m.pf}_${m.proceso.replace(/[^A-Za-z0-9]+/g,'_')}.xls`; a.click(); URL.revokeObjectURL(u);
}

/* ================= CLASIFICACIÓN PARA PRUEBAS INTEGRALES ================= */
function clasificaPI(pf){
  const m=MODS.find(x=>x.pf===pf);
  const items=m.grupos.flatMap((g,gi)=>g.items.map(i=>({...i,etapa:g.etapa,gi})));
  const P=m.pi||[];
  abrir(`<div class="stik">
     <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
       <div><h3>Clasificar para pruebas integrales</h3>
         <div class="mini2">${esc(m.proceso)} · asigna a cada actividad su tipo de prueba integral y el orden en que se ejecuta.</div></div>
       <button class="x" id="dx">×</button></div>
     <div class="rowf" style="margin-top:10px"><label>Tipos de prueba integral (edítalos, separados por coma)</label>
       <input id="tPI" value="${esc(TIPOSPI.join(', '))}"></div>
     <div class="rowf"><label>Etapas del módulo — libera las que ya pueden entrar a integrales</label>
       <div style="display:flex;flex-wrap:wrap;gap:6px">${m.grupos.map((g,gi)=>
         `<label class="chk3 ${g.lib?'on':''}"><input type="checkbox" data-lb2="${gi}" ${g.lib?'checked':''}> ${esc(g.etapa)}</label>`).join('')}</div></div>
     <div class="rowf"><label>Habilitación del módulo</label>
       <label class="chk3 ${m.habPI?'on':''}" style="width:fit-content"><input type="checkbox" data-hb2 ${m.habPI?'checked':''} ${puedeHab(m)?'':'disabled'}>
         ${m.habPI?'Módulo habilitado para PI':`Faltan ${m.grupos.length-etapasLib(m)} etapas por liberar`}</label></div>
   </div>
   <h3 style="font-size:14px;margin:4px 0 8px">Pruebas integrales de este módulo</h3>
   ${P.length? `<table class="tbl"><thead><tr><th>Prueba</th><th style="min-width:150px">Tipo</th><th>Estado</th></tr></thead><tbody>`+
     P.map((x,xi)=>{const E=estadoPI(x);
      return `<tr><td class="com">${esc(x.pi)}<div class="mini">${esc(E.req.map(r=>r.proceso).join(' · '))}</div></td>
       <td><select class="inl" data-pit="${xi}"><option value="">Sin clasificar</option>${TIPOSPI.map(t=>`<option ${t===x.tipo?'selected':''}>${t}</option>`).join('')}</select></td>
       <td>${E.hab?pill('ok','✓','Habilitada'):pill('pend','○',`${E.listos}/${E.req.length} módulos`)}</td></tr>`}).join('')+'</tbody></table>'
     : '<div class="warn i">Este proceso no participa en ninguna prueba integral.</div>'}
   <h3 style="font-size:14px;margin:18px 0 8px">Secuencia de actividades</h3>
   ${items.length? `<table class="tbl"><thead><tr><th>Actividad</th><th style="min-width:140px">Tipo de PI</th><th style="width:78px">Orden</th></tr></thead><tbody>`+
     items.map(i=>`<tr><td class="com"><span class="cod">${esc(i.cod)}</span>${esc(i.nombre)}<div class="mini">${esc(i.etapa)}</div></td>
       <td><select class="inl" data-at="${i.cod}"><option value="">—</option>${TIPOSPI.map(t=>`<option ${t===i.piTipo?'selected':''}>${t}</option>`).join('')}</select></td>
       <td><input class="inl" type="number" min="1" data-ao="${i.cod}" value="${esc(i.piOrden)}"></td></tr>`).join('')+'</tbody></table>'
     : '<div class="warn">Este proceso no tiene actividades levantadas.</div>'}`);
  const find=c=>{let r=null; m.grupos.forEach(g=>g.items.forEach(i=>{if(i.cod===c)r=i})); return r};
  document.getElementById('dx').onclick=cerrar;
  document.getElementById('tPI').onchange=e=>{
    TIPOSPI=e.target.value.split(',').map(x=>x.trim()).filter(Boolean); clasificaPI(pf); render()};
  drw.querySelectorAll('[data-lb2]').forEach(c=>c.onchange=()=>{
    m.grupos[+c.dataset.lb2].lib=c.checked; if(!puedeHab(m)) m.habPI=false; clasificaPI(pf); render()});
  const hb=drw.querySelector('[data-hb2]'); if(hb) hb.onchange=()=>{m.habPI=hb.checked; clasificaPI(pf); render()};
  drw.querySelectorAll('[data-pit]').forEach(sl=>sl.onchange=()=>{P[+sl.dataset.pit].tipo=sl.value;
    MODS.forEach(z=>(z.pi||[]).forEach(y=>{if(y.pi===P[+sl.dataset.pit].pi) y.tipo=sl.value})); clasificaPI(pf); render()});
  drw.querySelectorAll('[data-at]').forEach(sl=>sl.onchange=()=>{find(sl.dataset.at).piTipo=sl.value});
  drw.querySelectorAll('[data-ao]').forEach(ip=>ip.onchange=()=>{find(ip.dataset.ao).piOrden=ip.value});
}

/* ================= CORTES / HISTORIAL ================= */
function corte(){
  const L=vis(), A=agrega(L);
  const s={ts:new Date().toLocaleString('es-MX'), fecha:hoyISO(),
    empresa:EMP==='TODAS'?'Ambas':EMP, modulos:SEL.size, consultores:[...CSEL].join(', '),
    rango: RANGO.modo==='todo'?'Todo el programa':`${fmt(RANGO.desde)}${RANGO.hasta&&RANGO.hasta!==RANGO.desde?' → '+fmt(RANGO.hasta):''}`,
    procesos:L.length, sesiones:A.ses.length, ejecutadas:A.ejec,
    actividades:A.acts.length, hechas:A.ok, parciales:A.par,
    pf: A.pf==null?null:Math.round(A.pf*100), pfEsp: A.pfEsp==null?null:Math.round(A.pfEsp*100),
    procesosCerrados:A.cerrados, procesosTotal:A.nProc,
    pfAct: A.pfAct==null?null:Math.round(A.pfAct*100),
    pi: A.pi==null?null:Math.round(A.pi*100), piEsp: A.piEsp==null?null:Math.round(A.piEsp*100),
    modsListos:A.modsListos, modsReq:A.modsReq.length,
    replan:A.repl, movimientos:A.mov,
    conflictos: MODS.flatMap(m=>m.sesiones).filter(x=>x.conf).length};
  SNAPS.push(s); render(); historial();
}
function historial(){
  abrir(`<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
      <div><h3>Historial de cortes</h3><div class="mini2">Cada corte es una foto del tablero con los filtros que tenías puestos.</div></div>
      <button class="x" id="dx">×</button></div>
    ${SNAPS.length? `<table class="tbl snap"><thead><tr><th>Corte</th><th>Alcance</th><th>P.F.</th><th>P.I.</th><th>Sesiones</th><th>Actividades</th></tr></thead><tbody>`+
      SNAPS.slice().reverse().map((s,i)=>{const prev=SNAPS[SNAPS.length-2-i];
        const fl=(a,b)=>a==null?'':(b==null?'':(a-b>0?` <span style="color:var(--good-ink)">▲${a-b}</span>`:a-b<0?` <span style="color:var(--critical)">▼${b-a}</span>`:''));
        return `<tr><td><b>${esc(s.ts)}</b><div class="mini">${esc(s.rango)}</div></td>
         <td class="mini">${esc(s.empresa)} · ${s.procesos} procesos · ${s.modulos} módulos</td>
         <td class="num"><b>${s.pf==null?'—':s.pf+'%'}</b>${prev?fl(s.pf,prev.pf):''}</td>
         <td class="num"><b>${s.pi==null?'—':s.pi+'%'}</b>${prev?fl(s.pi,prev.pi):''}</td>
         <td class="num">${s.ejecutadas}/${s.sesiones}</td>
         <td class="num">${s.hechas}/${s.actividades}${s.parciales?` <span class="mini">· ${s.parciales} parc.</span>`:''}</td></tr>`}).join('')+'</tbody></table>'
      : '<div class="warn i">Todavía no hay cortes. Pulsa «Guardar corte» para tomar la primera foto.</div>'}
    <div style="display:flex;gap:8px;margin-top:14px">
      <button id="hXls" style="flex:1">Descargar historial en Excel</button>
      <button id="hNew" style="background:var(--blue);border-color:var(--blue);color:#fff">Tomar corte ahora</button></div>`);
  document.getElementById('dx').onclick=cerrar;
  document.getElementById('hNew').onclick=corte;

/* ---- importación de pendientes: lee el mismo .xls/.csv que exporta este panel ---- */
function parsePendientes(txt, nombre){
  let filas=[];
  if(/\.csv$/i.test(nombre) || (!/<table/i.test(txt) && txt.includes(','))){
    const l0=txt.split('\n')[0];
    const sep=(l0.match(/;/g)||[]).length>(l0.match(/,/g)||[]).length ? ';' : ',';
    txt.split(/\r?\n/).forEach(l=>{
      if(!l.trim())return;
      const c=[]; let q=false, cur='';
      for(const ch of l){ if(ch==='"') q=!q; else if(ch===sep&&!q){c.push(cur);cur=''} else cur+=ch }
      c.push(cur); filas.push(c.map(x=>x.trim()));
    });
  } else {
    const d=new DOMParser().parseFromString(txt,'text/html');
    d.querySelectorAll('tr').forEach(tr=>filas.push([...tr.querySelectorAll('td,th')].map(td=>td.textContent.trim())));
  }
  const iH=filas.findIndex(f=>f.some(c=>/^c[oó]digo$/i.test((c||'').trim())));
  if(iH<0) return {error:'No encontré el encabezado. El archivo debe traer una columna «Código», como el que baja este panel.'};
  const H=filas[iH].map(c=>(c||'').toLowerCase());
  const col=re=>H.findIndex(c=>re.test(c));
  const IX={cod:col(/^c[oó]digo$/), est:col(/^estado$/), com:col(/^comentario$/),
            acc:col(/acci[oó]n de soluci[oó]n/), fen:col(/fecha de entrega/), resp:col(/^responsable$/)};
  if(IX.cod<0 || IX.acc<0) return {error:'El archivo no trae las columnas «Código» y «Acción de solución».'};
  const out=[];
  for(let i=iH+1;i<filas.length;i++){
    const f=filas[i]; const cod=(f[IX.cod]||'').trim();
    if(!/^\d+\.\d+\.\d+$/.test(cod)) continue;
    out.push({cod, estado:(f[IX.est]||'').trim(),
      com: IX.com>=0? (f[IX.com]||'').trim() : '',
      accion:(f[IX.acc]||'').trim(),
      fEnt: IX.fen>=0? normFecha(f[IX.fen]) : '',
      respP: IX.resp>=0? (f[IX.resp]||'').trim() : ''});
  }
  return {filas:out};
}
const respGen=s=>{const t=(s||'').trim().toLowerCase();
  return !t || t==='—' || t.startsWith('no definido') || t==='por definir'};

/* Compara sin aplicar: dice exactamente qué cambiaría. */
function analizaPendientes(lista){
  const IDX={}; MODS.forEach(m=>m.grupos.forEach(g=>g.items.forEach(i=>IDX[i.cod]=[m,i])));
  const r={accNueva:[],accCambia:[],respNuevo:[],respCambia:[],fecha:[],com:[],igual:0,desconocido:[],vaciaria:[]};
  lista.forEach(x=>{
    const par=IDX[x.cod];
    if(!par){ r.desconocido.push(x.cod); return }
    const [m,it]=par; const ta=(it.accion||'').trim(), tr=(it.respP||'').trim(), tf=(it.fEnt||'').trim(), tc=(it.com||'').trim();
    let toco=false;
    if(x.accion && !ta){ r.accNueva.push({...x,proc:m.proceso,nombre:it.nombre,antes:''}); toco=true }
    else if(x.accion && ta && x.accion.slice(0,40).toLowerCase()!==ta.slice(0,40).toLowerCase()){
      r.accCambia.push({...x,proc:m.proceso,nombre:it.nombre,antes:ta,corta:x.accion.length<ta.length*0.7}); toco=true }
    else if(!x.accion && ta){ r.vaciaria.push({...x,proc:m.proceso,nombre:it.nombre,antes:ta}) }
    if(x.respP && !respGen(x.respP) && respGen(tr)){ r.respNuevo.push({...x,proc:m.proceso,antes:tr}); toco=true }
    else if(x.respP && !respGen(x.respP) && !respGen(tr) && x.respP!==tr){ r.respCambia.push({...x,proc:m.proceso,antes:tr}); toco=true }
    if(x.fEnt && x.fEnt!==tf){ r.fecha.push({...x,proc:m.proceso,antes:tf}); toco=true }
    if(x.com && !tc){ r.com.push({...x,proc:m.proceso}); toco=true }
    if(!toco) r.igual++;
  });
  return r;
}

let RESP_PEND=null;
function aplicaPendientes(lista, modo, pf){
  RESP_PEND=JSON.parse(JSON.stringify(MODS));
  const IDX={}; MODS.forEach(m=>m.grupos.forEach(g=>g.items.forEach(i=>IDX[i.cod]=i)));
  let nA=0,cA=0,nR=0,nF=0,nC=0,skip=0;
  lista.forEach(x=>{
    const it=IDX[x.cod]; if(!it)return;
    const ta=(it.accion||'').trim(), tr=(it.respP||'').trim();
    /* acción */
    if(x.accion){
      if(!ta){ it.accion=x.accion; nA++; tocar(it) }
      else if(x.accion.slice(0,40).toLowerCase()!==ta.slice(0,40).toLowerCase()){
        if(modo==='reemplazar' || (modo==='mejor' && x.accion.length>=ta.length)){ it.accion=x.accion; cA++; tocar(it) }
        else skip++;
      }
    } else if(modo==='reemplazar' && ta){ it.accion=''; tocar(it) }
    /* responsable: nunca se degrada a «No definido» */
    if(x.respP && !respGen(x.respP) && (respGen(tr) || modo==='reemplazar' || modo==='mejor')){
      if(x.respP!==tr){ it.respP=x.respP; nR++; tocar(it) }
    }
    if(x.fEnt && x.fEnt!==(it.fEnt||'')){ it.fEnt=x.fEnt; nF++; tocar(it) }
    if(x.com && !(it.com||'').trim()){ it.com=x.com; nC++; tocar(it) }
  });
  render();
  abrir(`<div class="stik"><div style="display:flex;justify-content:space-between">
      <div><h3>Pendientes cargados</h3><div class="mini2">Modo: ${
        modo==='complementar'?'solo llenar vacíos':modo==='mejor'?'llenar vacíos y quedarse con la versión más completa':'reemplazar todo'}</div></div>
      <button class="x" id="dx">×</button></div></div>
    <div class="capt">

        <div class="sub2">${nR} responsable(s) · ${nF} fecha(s) de entrega · ${nC} comentario(s).
        ${skip? skip+' reformulación(es) se dejaron como estaban porque el tablero tenía más detalle.':''}</div></div>
      <div class="act"><div class="ttl">¿No era lo que esperabas?</div>
        <div class="sub2">Puedes deshacer esta carga y volver al estado anterior.</div>
        <div class="rg"><button id="undoP">Deshacer la carga</button></div></div></div>`);
  document.getElementById('dx').onclick=()=>{cerrar(); if(pf) pendientes(pf)};
  document.getElementById('undoP').onclick=()=>{
    if(!RESP_PEND)return;
    MODS.length=0; JSON.parse(JSON.stringify(RESP_PEND)).forEach(m=>MODS.push(m));
    RESP_PEND=null; render(); cerrar(); alert('Se restauró el estado anterior a la carga.');
  };
}

/* ================= INFORME EJECUTIVO ================= */
function esperado(m){        // % de ACTIVIDADES de PF que ya debieron probarse (misma base que el avance)
  return agrega([m]).pfEsp;
}
function saludPI(A){
  if(!A.pis.length) return ['v','Sin flujos en la selección'];
  if(A.hab===A.pis.length) return ['v','Listas para arrancar'];
  const req=A.modsReq.length, listos=A.modsListos;
  const arranque=A.pis.map(p=>p.fechaISO).filter(Boolean).sort()[0];
  const dias=arranque? Math.round((d(arranque)-d(HOY))/864e5) : null;
  if(dias!=null && dias<=14 && listos===0) return ['r','Sin acreditación'];
  if(!req || listos < req/2) return ['a','Acreditación pendiente'];
  return ['a','En preparación'];
}
const CARA={v:'🙂',a:'😐',r:'☹️'};
function salud(dev, conf, sinLev){
  if(sinLev) return ['r','Sin levantamiento'];
  if(dev<=-25||conf>=2) return ['r','En riesgo'];
  if(dev<=-10||conf>=1) return ['a','Con atención'];
  return ['v','En tiempo'];
}
function vistaInforme(){
  const L=vis();
  if(!L.length){document.getElementById('informe').innerHTML='<div class="card"><div class="warn">Selecciona al menos un módulo.</div></div>';return}
  const A=agrega(L);
  /* PF y PI se calculan por separado: cada uno contra su propio esperado */
  const espG=A.pfEsp||0, realG=A.pf||0, devG=Math.round((realG-espG)*100);
  const piReal=A.pi||0, piEsp=A.piEsp||0, piDev=Math.round((piReal-piEsp)*100);
  const [pc,pt]=saludPI(A);
  const piArr=A.pis.map(p=>p.fechaISO).filter(Boolean).sort();
  const bloq=(()=>{const c={}; A.pis.forEach(p=>{const e=estadoPI(p);
      e.req.filter(x=>!x.habPI).forEach(x=>{c[x.proceso]=(c[x.proceso]||0)+1})});
    return Object.entries(c).sort((a,b)=>b[1]-a[1])})();
  const conflictos=L.flatMap(m=>sesVis(m)).filter(s=>s.conf&&s.conf.t!=='comb').length;
  const sinLev=L.filter(m=>!m.ident).length;
  const pendT=L.flatMap(m=>m.grupos.flatMap(g=>g.items)).filter(i=>i.res!=='HECHA');
  const vencidos=pendT.filter(i=>i.fEnt&&i.fEnt<HOY).length;
  const [sc,st]=salud(devG, conflictos>=13?2:conflictos?1:0, sinLev>L.length/2);
  const filas=L.map(m=>{
    const a=agrega([m]), e=esperado(m), dev=e==null||a.pf==null?null:Math.round((a.pf-e)*100);
    const pen=m.grupos.flatMap(g=>g.items).filter(i=>i.res!=='HECHA');
    const cf=sesVis(m).filter(s=>s.conf&&s.conf.t!=='comb').length;
    const [c,t]=salud(dev==null?0:dev, cf?1:0, !m.ident);
    const P=m.pi||[], hab=P.filter(x=>estadoPI(x).hab).length;
    return {m,a,e,dev,pen,cf,c,t,P,hab};
  }).sort((x,y)=>({v:2,a:1,r:0}[x.c])-({v:2,a:1,r:0}[y.c]));
  const rojo=filas.filter(f=>f.c==='r').length, ambar=filas.filter(f=>f.c==='a').length;
  document.getElementById('informe').innerHTML=`
   <div class="card">
     <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap">
       <div><h1>Informe ejecutivo — Pruebas Funcionales</h1>
         <div class="mod" style="font-size:22px">Proyecto Alpha · Odoo 18 · TG&amp;S Cards / Litho Formas</div>
         <div class="meta">Corte al ${fmtLargo(HOY)} · ${L.length} procesos · ${EMP==='TODAS'?'ambas empresas':esc(EMP)}${RANGO.modo!=='todo'&&RANGO.desde?` · ventana ${fmt(RANGO.desde)}${RANGO.hasta&&RANGO.hasta!==RANGO.desde?' a '+fmt(RANGO.hasta):''}`:''}</div></div>
       <div style="text-align:right">
         <div class="mini" style="margin-bottom:4px">ESTADO DE PRUEBAS FUNCIONALES</div>
         <span class="salud ${sc}" style="font-size:15px;padding:6px 16px"><span style="font-size:26px;line-height:1">${CARA[sc]}</span> ${st}</span></div>
     </div>
     <div class="kpis" style="margin-top:14px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))">
       <div class="kpi"><div class="k">Avance de P.F. · promedio por proceso</div><div class="big">${Math.round(realG*100)}%</div>
         <div class="gap"><div class="gapbar"><div class="real" style="width:${Math.round(realG*100)}%"></div>
           <div class="esp" style="left:${Math.round(espG*100)}%"></div></div></div>
         <div class="sub">Cada proceso pesa igual · esperado a la fecha ${Math.round(espG*100)}% · <b style="color:${devG<0?'var(--critical)':'var(--good-ink)'}">${devG>0?'+':''}${devG} puntos</b></div></div>
       <div class="kpi"><div class="k">Procesos de P.F. cerrados</div><div class="big">${A.cerrados}<span style="font-size:18px;color:var(--ink-muted)">/${A.nProc}</span></div>
         <div class="sub">${A.enCurso} en curso · ${A.sinIni} sin iniciar${A.sinLevN?` · <b style="color:var(--critical)">${A.sinLevN} sin levantamiento</b>`:''}</div></div>
       <div class="kpi ${pendT.length?'warn':''}"><div class="k">Actividades de P.F. pendientes</div><div class="big">${pendT.length}<span style="font-size:18px;color:var(--ink-muted)">/${A.acts.length}</span></div>
         <div class="sub">${A.ok} hechas · ${A.actVenc} ya debieron probarse · ${vencidos? `<b style="color:var(--critical)">${vencidos} con fecha vencida</b>`:'sin compromisos vencidos'}</div></div>
       <div class="kpi ${A.pBloq?'alarm':''}"><div class="k">Prácticas · repeticiones acreditadas</div>
         <div class="big">${A.pCasosTot}<span style="font-size:18px;color:var(--ink-muted)">/${A.pMeta}</span></div>
         <div class="sub">${A.pFirm} de ${A.pConMeta} actividades cerradas · ${A.pEvi} evidencia(s)${A.pListas?` · ${A.pListas} lista(s) para cerrar`:''}${A.pBloq?` · <b style="color:var(--critical)">${A.pBloq} bloqueante(s)</b>`:''}${A.pSinEvi?` · <b style="color:var(--critical)">${A.pSinEvi} con bitácora pero sin evidencia</b>`:''}</div></div>
       <div class="kpi ${conflictos?'alarm':''}"><div class="k">Empalmes de agenda</div><div class="big">${conflictos}</div>
         <div class="sub">sesiones encimadas en la ventana</div></div>
     </div>
     <div class="warn ${rojo?'c':ambar?'':'i'}" style="margin-top:14px">
       <b>Lectura para dirección.</b> ${rojo} proceso(s) en riesgo, ${ambar} con atención y ${filas.length-rojo-ambar} en tiempo.
       ${sinLev?`<b>${sinLev} proceso(s) siguen sin levantamiento AS-IS</b>: tienen sesiones agendadas sin contenido que probar. `:''}
       ${conflictos>=10?`Con el PMO presente en todas las sesiones, hay <b>${conflictos} sesiones encimadas</b> que no pueden ejecutarse como están. `:''}
       ${devG<0?`El avance de PF va <b>${Math.abs(devG)} puntos por debajo</b> de lo que el calendario esperaba a esta fecha: <b>${A.cerrados} de ${A.nProc} procesos cerrados</b> y ${A.actVenc} actividades que ya debieron probarse contra ${A.ok} hechas.`:'El avance de PF va conforme al calendario.'}
       ${A.pSinLider?`<b>${A.pSinLider} proceso(s) no tienen responsable del área</b> en la actividad de prácticas: sin ese nombre no hay quién entregue la bitácora. `:''}
       ${A.pBloq?`Hay <b>${A.pBloq} faltante(s) bloqueante(s)</b> abiertos que impiden firmar la guía de su proceso. `:''}
       <span class="mini2" style="display:block;margin-top:6px">Un proceso se da por cerrado con cuatro condiciones: actividades en «Hecha», bitácora entregada con al menos las repeticiones acordadas, cero faltantes bloqueantes y evidencia adjunta. El avance se calcula sobre el <b>total de procesos</b>, no sobre el número de sesiones: cada proceso pesa igual y las sesiones se miden aparte, en la vista de agenda. Este bloque no incluye pruebas integrales.</span>
     </div>
   </div>
   <div class="card">
     <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap">
       <div><h1>Informe ejecutivo — Pruebas Integrales</h1>
         <div class="meta">Base de cálculo propia: flujos habilitados sobre flujos definidos. Un flujo se habilita cuando <b>todos</b> los módulos que cruza quedan acreditados.</div></div>
       <div style="text-align:right">
         <div class="mini" style="margin-bottom:4px">ESTADO DE PRUEBAS INTEGRALES</div>
         <span class="salud ${pc}" style="font-size:15px;padding:6px 16px"><span style="font-size:26px;line-height:1">${CARA[pc]}</span> ${pt}</span></div>
     </div>
     <div class="kpis" style="margin-top:14px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))">
       <div class="kpi"><div class="k">Avance de P.I. · flujos habilitados</div><div class="big">${Math.round(piReal*100)}%</div>
         <div class="gap"><div class="gapbar"><div class="real" style="width:${Math.round(piReal*100)}%"></div>
           <div class="esp" style="left:${Math.round(piEsp*100)}%"></div></div></div>
         <div class="sub">${A.hab} de ${A.pis.length} flujos · esperado a la fecha ${Math.round(piEsp*100)}% · <b style="color:${piDev<0?'var(--critical)':'var(--good-ink)'}">${piDev>0?'+':''}${piDev} puntos</b></div></div>
       <div class="kpi ${A.modsListos<A.modsReq.length?'warn':''}"><div class="k">Módulos acreditados</div>
         <div class="big">${A.modsListos}<span style="font-size:18px;color:var(--ink-muted)">/${A.modsReq.length}</span></div>
         <div class="sub">se acredita marcando liberadas todas las etapas del módulo</div></div>
       <div class="kpi"><div class="k">Arranque previsto</div><div class="big" style="font-size:26px">${piArr.length?fmt(piArr[0]):'—'}</div>
         <div class="sub">${piArr.length?`cierre previsto ${fmt(piArr[piArr.length-1])}`:'sin fechas asignadas'}</div></div>
       <div class="kpi ${bloq.length?'alarm':''}"><div class="k">Flujos bloqueados</div>
         <div class="big">${A.pis.length-A.hab}<span style="font-size:18px;color:var(--ink-muted)">/${A.pis.length}</span></div>
         <div class="sub">${bloq.length? `lo que más bloquea: ${esc(bloq.slice(0,2).map(b=>b[0]+' ('+b[1]+')').join(' · '))}`:'nada los bloquea'}</div></div>
     </div>
     <div class="warn ${pc==='r'?'c':pc==='a'?'':'i'}" style="margin-top:14px">
       <b>Lectura para dirección.</b> ${A.hab} de ${A.pis.length} flujos integrales están habilitados.
       ${A.modsReq.length? `Requieren <b>${A.modsReq.length} módulos acreditados</b> y hoy hay ${A.modsListos}. `:''}
       ${bloq.length? `Los que más flujos detienen: ${esc(bloq.slice(0,4).map(b=>b[0]+' — '+b[1]+' flujo(s)').join(' · '))}. `:''}
       ${piArr.length? `El arranque previsto es el ${fmt(piArr[0])} y el cierre el ${fmt(piArr[piArr.length-1])}.`:''}
       <span class="mini2" style="display:block;margin-top:6px">El plan de PI es un escenario: se recalcula en cuanto cambian los resultados de PF.</span>
     </div>
   </div>
   <div class="card">
     <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
       <h1>Estado por proceso</h1>
       <div style="display:flex;gap:8px">
         <button id="iXls" style="background:var(--blue);border-color:var(--blue);color:#fff">Exportar a Excel</button>
         <button id="iPdf">Guardar como PDF</button></div>
     </div>
     <div class="tscroll" style="max-height:none"><table class="tbl"><thead><tr>
       <th style="width:52px"></th><th>Módulo</th><th>Empresa</th><th>Consultor</th>
       <th>Avance</th><th>Sesiones</th><th>Actividades</th>
       <th>Pendientes</th><th style="min-width:300px">Observaciones</th></tr></thead><tbody>`
     + filas.map(f=>{
        const v=f.pen.filter(i=>i.fEnt&&i.fEnt<HOY).length;
        const obs=[...new Set(f.pen.map(i=>i.com).filter(Boolean))];
        const txt = obs.length? obs.slice(0,3).map(esc).join(' · ')+(obs.length>3?` · +${obs.length-3} más`:'')
          : (!f.m.ident?'Sin levantamiento AS-IS: no hay actividades que probar'
             : f.pen.length? 'Sin observaciones capturadas en los pendientes' : 'Todo cerrado');
        return `<tr>
         <td style="text-align:center;font-size:26px;line-height:1" title="${esc(f.t)}">${CARA[f.c]}</td>
         <td><b>${esc(f.m.proceso)}</b><div class="mini">${esc(f.m.modulo)}</div></td>
         <td class="mini">${esc(f.m.empresa)}</td>
         <td class="mini">${esc(f.m.ficha.consultor)}</td>
         <td class="num"><b>${f.a.pf==null?'—':Math.round(f.a.pf*100)+'%'}</b></td>
         <td class="num">${f.a.ejec}/${f.a.ses.length}</td>
         <td class="num">${f.a.ok}/${f.a.acts.length}</td>
         <td class="num">${f.pen.length}${v?` <span style="color:var(--critical)">(${v} venc.)</span>`:''}</td>
         <td class="com mini">${txt}</td></tr>`}).join('')
     + `</tbody></table></div>
     <div style="margin-top:18px;display:flex;gap:40px;flex-wrap:wrap">
       <div><div class="mini">Elaboró</div><div style="border-bottom:1px solid var(--baseline);width:230px;height:34px"></div>
         <div class="mini2">Luis Monzón · Doer Partners</div></div>
       <div><div class="mini">Revisó</div><div style="border-bottom:1px solid var(--baseline);width:230px;height:34px"></div>
         <div class="mini2">Dirección de Proyecto</div></div>
       <div><div class="mini">Fecha</div><div style="border-bottom:1px solid var(--baseline);width:150px;height:34px"></div>
         <div class="mini2">${fmtLargo(HOY)}</div></div>
     </div>
   </div>`;
  document.getElementById('iPdf').onclick=()=>window.print();
  document.getElementById('iXls').onclick=()=>xlsInformeConsolidado(L,[
    `Corte al ${fmtLargo(HOY)} · ${L.length} procesos · ${EMP==='TODAS'?'ambas empresas':EMP} · salud del programa: ${st}`,
    `Avance real ${Math.round(realG*100)}% contra ${Math.round(espG*100)}% esperado a la fecha (${devG>0?'+':''}${devG} puntos)`,
    `${A.ejec} de ${A.ses.length} sesiones ejecutadas · ${pendT.length} actividades pendientes (${vencidos} con fecha vencida) · ${conflictos} empalmes de agenda · ${A.hab} de ${A.pis.length} pruebas integrales habilitadas`]);
}

/* ============ INFORME EJECUTIVO · EXCEL CONSOLIDADO ============ */
function xlsInformeConsolidado(L,resumen){
  const N=20;                                   // celdas de la barra
  const col=p=>p>=0.8?'#0CA30C':p>=0.4?'#FAB219':'#D03B3B';
  const barra=(p,c)=>{let s='';
    const f=Math.round((p||0)*N);
    for(let i=0;i<N;i++){const bg=i<f?(c||col(p)):'#EDEDE8';
      s+=`<td bgcolor="${bg}" width="15" style="background-color:${bg};border:.5pt solid #FFFFFF;font-size:6pt;color:${bg}">.</td>`}
    return s};
  const B='border:.5pt solid #BFBFBF;font-family:Arial;';
  const pct=p=>p==null?'—':Math.round(p*100)+'%';
  const prox=I=>{const f=I.filter(x=>x.fEnt).map(x=>x.fEnt).sort(); return f.length?fmt(f[0]):''};
  const cara=p=>p==null?'😐':p>=0.8?'🙂':p>=0.4?'😐':'☹️';

  let x=`<html><head><meta charset="utf-8"></head><body><table cellspacing="0">
   <colgroup><col width="330"><col width="58">${Array.from({length:N},()=>'<col width="15">').join('')}
     <col width="150"><col width="118"><col width="96"></colgroup>
   <tr><td colspan="${N+5}" bgcolor="#1F3864" style="${B}font-size:14pt;font-weight:bold;color:#FFFFFF;background-color:#1F3864;height:30px">
     &nbsp;PROYECTO ALPHA · Estado del programa de Pruebas Funcionales</td></tr>`;
  resumen.forEach(r=>{x+=`<tr><td colspan="${N+5}" style="font-family:Arial;font-size:10pt;color:#333333">&nbsp;${esc(r)}</td></tr>`});
  x+=`<tr><td colspan="${N+5}"></td></tr>
   <tr>${['Módulo · proceso · etapa','Avance'].map(t=>`<td bgcolor="#1F3864" style="${B}font-weight:bold;color:#FFFFFF;background-color:#1F3864;font-size:9pt">&nbsp;${t}</td>`).join('')}
     <td colspan="${N}" bgcolor="#1F3864" style="${B}font-weight:bold;color:#FFFFFF;background-color:#1F3864;font-size:9pt;text-align:center">0% ————————————— 100%</td>
     ${['','Pendientes','Próxima entrega'].map(t=>`<td bgcolor="#1F3864" style="${B}font-weight:bold;color:#FFFFFF;background-color:#1F3864;font-size:9pt;text-align:center">${t}</td>`).join('')}</tr>`;

  const mods={};
  L.forEach(m=>{(mods[m.modulo] ||= []).push(m)});
  Object.entries(mods).forEach(([mod,PR])=>{
    const A=agrega(PR);
    const pend=PR.flatMap(m=>m.grupos.flatMap(g=>g.items)).filter(i=>i.res!=='HECHA');
    x+=`<tr><td bgcolor="#D9E2F3" style="${B}font-size:11pt;font-weight:bold;background-color:#D9E2F3;color:#1F3864">&nbsp;${esc(mod)}</td>
       <td bgcolor="#D9E2F3" style="${B}font-size:11pt;font-weight:bold;background-color:#D9E2F3;text-align:center">${pct(A.pf)}</td>
       ${barra(A.pf)}
       <td bgcolor="#D9E2F3" style="${B}background-color:#D9E2F3;font-size:16pt;text-align:center">${cara(A.pf)}</td>
       <td bgcolor="#D9E2F3" style="${B}background-color:#D9E2F3;font-size:9pt;text-align:center">${pend.length}</td>
       <td bgcolor="#D9E2F3" style="${B}background-color:#D9E2F3;font-size:9pt;text-align:center">${prox(pend)}</td></tr>`;
    PR.forEach(m=>{
      const a=agrega([m]);
      const pm=m.grupos.flatMap(g=>g.items).filter(i=>i.res!=='HECHA');
      x+=`<tr><td style="${B}font-size:10pt;font-weight:bold">&nbsp;&nbsp;&nbsp;${esc(m.proceso)}</td>
         <td style="${B}font-size:10pt;font-weight:bold;text-align:center">${pct(a.pf)}</td>
         ${barra(a.pf)}
         <td style="${B}font-size:16pt;text-align:center">${cara(a.pf)}</td>
         <td style="${B}font-size:9pt;text-align:center">${pm.length}</td>
         <td style="${B}font-size:9pt;text-align:center">${prox(pm)}</td></tr>`;
      m.grupos.forEach(g=>{
        const ok=g.items.filter(i=>i.res==='HECHA').length, p=g.items.length?ok/g.items.length:null;
        const pe=g.items.filter(i=>i.res!=='HECHA');
        x+=`<tr><td style="${B}font-size:9pt;color:#52514E">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;${esc(g.etapa)}${g.lib?' ✓':''}</td>
           <td style="${B}font-size:9pt;text-align:center">${pct(p)}</td>
           ${barra(p)}
           <td style="${B}font-size:13pt;text-align:center">${cara(p)}</td>
           <td style="${B}font-size:9pt;text-align:center">${pe.length}</td>
           <td style="${B}font-size:9pt;text-align:center">${prox(pe)}</td></tr>`;
      });
      const conF=pm.filter(i=>i.fEnt||i.accion);
      if(conF.length){
        x+=`<tr><td colspan="${N+5}" bgcolor="#FDF1D6" style="${B}font-size:8.5pt;font-weight:bold;background-color:#FDF1D6;color:#7A5300">&nbsp;&nbsp;&nbsp;&nbsp;Pendientes con compromiso · ${esc(m.proceso)}</td></tr>`;
        conF.forEach(i=>{
          const venc=i.fEnt&&i.fEnt<HOY;
          x+=`<tr><td colspan="2" style="${B}font-size:8.5pt">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;${esc(i.cod)} · ${esc(i.nombre)}</td>
            <td colspan="${N}" style="${B}font-size:8.5pt">&nbsp;${esc([i.com,i.accion].filter(Boolean).join(' → ')||'Sin observación capturada')}</td>
            <td style="${B}font-size:8.5pt">&nbsp;${esc(i.respP||'')}</td>
            <td style="${B}font-size:8.5pt;text-align:center;${venc?'background-color:#FAE3E3;color:#D03B3B;font-weight:bold':''}">${i.fEnt?fmt(i.fEnt):'sin fecha'}</td>
            <td style="${B}font-size:8.5pt;text-align:center">${venc?'VENCIDA':''}</td></tr>`;
        });
      }
    });
    x+=`<tr><td colspan="${N+5}" style="height:6px"></td></tr>`;
  });
  x+='</table></body></html>';
  const b=new Blob(['﻿'+x],{type:'application/vnd.ms-excel;charset=utf-8'}), u=URL.createObjectURL(b);
  const a=document.createElement('a'); a.href=u; a.download='Informe_Ejecutivo_PF_Alpha.xls'; a.click(); URL.revokeObjectURL(u);
}
(async()=>{ await cargarCompartido(); render(); })();
</script></body></html>
