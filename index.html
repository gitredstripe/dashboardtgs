<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tablero por módulo · Pruebas Funcionales · Proyecto Alpha</title>
<style>
:root{
  color-scheme:light;
  --surface-1:#fcfcfb; --plane:#f9f9f7; --surface-2:#f2f1ee;
  --ink-1:#0b0b0b; --ink-2:#52514e; --ink-muted:#898781;
  --grid:#e1e0d9; --baseline:#c3c2b7; --ring:rgba(11,11,11,.10);
  --blue:#2a78d6; --blue-tint:#e9f1fc;
  --good:#0ca30c; --good-tint:#e6f5e6; --good-ink:#006300;
  --warning:#fab219; --warning-tint:#fdf1d6; --warning-ink:#7a5300;
  --critical:#d03b3b; --critical-tint:#fae3e3;
  --seq1:#cde2fb; --seq2:#9ec5f4; --seq3:#6da7ec; --seq4:#3987e5;
  --shadow:0 1px 2px rgba(11,11,11,.06),0 8px 24px rgba(11,11,11,.06);
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --surface-1:#1a1a19; --plane:#0d0d0d; --surface-2:#232322;
  --ink-1:#fff; --ink-2:#c3c2b7; --ink-muted:#898781;
  --grid:#2c2c2a; --baseline:#383835; --ring:rgba(255,255,255,.10);
  --blue:#3987e5; --blue-tint:#16283d;
  --good:#0ca30c; --good-tint:#143014; --good-ink:#0ca30c;
  --warning:#fab219; --warning-tint:#3a2f11; --warning-ink:#fab219;
  --critical:#d03b3b; --critical-tint:#3a1c1c;
  --seq1:#184f95; --seq2:#256abf; --seq3:#2a78d6; --seq4:#3987e5;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.45);
}
*{box-sizing:border-box} html,body{margin:0;padding:0}
body{background:var(--plane);color:var(--ink-1);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1500px;margin:0 auto;padding:18px 20px 70px}
.card{background:var(--surface-1);border:1px solid var(--ring);border-radius:12px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
h1{font-size:15px;margin:0;color:var(--ink-2);font-weight:600;letter-spacing:.01em}
.mod{font-size:30px;font-weight:680;letter-spacing:-.025em;margin:1px 0 0;line-height:1.1}
.meta{font-size:12px;color:var(--ink-2);margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:99px;font-size:11px;font-weight:650;
  background:var(--surface-2);color:var(--ink-2);border:1px solid var(--ring);margin-right:5px}
select,button,input{font:inherit;color:var(--ink-1);background:var(--surface-1);border:1px solid var(--baseline);border-radius:8px;padding:7px 10px}
button{cursor:pointer;font-weight:550;font-size:13px} button:hover{background:var(--surface-2)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:3px}
.fld label{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-muted);font-weight:650}
.spacer{flex:1}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-top:2px}
.kpi{border:1px solid var(--ring);border-radius:10px;padding:12px 14px;background:var(--surface-1);position:relative}
.kpi .k{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-muted);font-weight:700}
.kpi .row{display:flex;align-items:baseline;gap:8px;margin-top:2px}
.kpi .v{font-size:34px;font-weight:680;letter-spacing:-.03em;line-height:1}
.kpi .tr{font-size:15px;font-weight:700;display:inline-flex;align-items:center;gap:2px}
.kpi .tr.up{color:var(--good-ink)} .kpi .tr.dn{color:var(--critical)} .kpi .tr.na{color:var(--ink-muted);font-size:13px}
.kpi .sub{font-size:11.5px;color:var(--ink-2);margin-top:5px;line-height:1.35}
.kpi .track{height:5px;border-radius:99px;background:var(--surface-2);margin-top:8px;overflow:hidden}
.kpi .fillb{height:100%;border-radius:99px;background:var(--blue)}
.kpi.nodata{border-style:dashed}
.kpi.nodata .v{color:var(--ink-muted)}
/* tabla */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-muted);font-weight:700;
  padding:7px 8px;border-bottom:1px solid var(--baseline);white-space:nowrap;background:var(--surface-1);position:sticky;top:0;z-index:3}
.tbl td{padding:5px 8px;border-bottom:1px solid var(--grid);vertical-align:middle}
.sec td{background:var(--surface-2);font-weight:700;font-size:13px;letter-spacing:-.005em;padding:8px}
.sec .pct{font-variant-numeric:tabular-nums}
.grp td{font-weight:600;background:color-mix(in srgb,var(--surface-2) 45%,transparent)}
.grp .nm{padding-left:22px}
.itm .nm{padding-left:44px;color:var(--ink-2)}
.nm{max-width:420px}
.cod{font-size:10.5px;color:var(--ink-muted);font-variant-numeric:tabular-nums;margin-right:6px}
.st{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:99px;font-size:11px;font-weight:700;border:1px solid transparent;white-space:nowrap}
.st.ok{background:var(--good-tint);color:var(--good-ink);border-color:var(--good)}
.st.proc{background:var(--blue-tint);color:var(--blue);border-color:var(--blue)}
.st.pend{background:var(--warning-tint);color:var(--warning-ink);border-color:var(--warning)}
.st.blo{background:var(--critical-tint);color:var(--critical);border-color:var(--critical)}
.st.na{background:var(--surface-2);color:var(--ink-muted);border-color:var(--baseline)}
.fecha{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:12.5px}
.fecha .hr{color:var(--ink-muted);font-size:11px}
.com{color:var(--ink-2);font-size:12px}
.mini{font-size:11px;color:var(--ink-muted)}
.tog{border:0;background:none;cursor:pointer;color:var(--ink-muted);font-size:11px;padding:0 6px 0 0;width:18px;min-height:auto}
.tog:hover{color:var(--blue)}
/* gantt strip */
.gcell{padding:0 !important;position:relative;width:26px;min-width:26px;border-left:1px solid var(--grid)}
.gcell.we{background:var(--surface-2)}
th.gcell{text-align:center;font-size:9.5px;padding:2px 0 !important;line-height:1.15}
th.gcell b{display:block;font-size:11px;color:var(--ink-1);font-variant-numeric:tabular-nums}
.gb{position:absolute;inset:4px 2px;border-radius:3px;background:var(--blue)}
.gb.done{background:var(--good)}
.gb.grp{inset:6px 0;border-radius:2px;background:var(--seq2)}
.gb.act{inset:6px 3px;border-radius:2px;background:var(--seq3);opacity:.75}
.gb.hoy{outline:2px solid var(--ink-1);outline-offset:-2px}
.todayline{position:absolute;top:0;bottom:0;width:2px;background:var(--critical);left:50%;z-index:2}
.leg{display:flex;flex-wrap:wrap;gap:14px;font-size:11.5px;color:var(--ink-2);margin-top:10px}
.warn{border-left:3px solid var(--warning);background:var(--warning-tint);padding:9px 11px;border-radius:0 7px 7px 0;font-size:12.5px;margin-top:10px}
.warn.c{border-color:var(--critical);background:var(--critical-tint)}
.warn.i{border-color:var(--blue);background:var(--blue-tint)}
.scroll{overflow:auto;max-height:64vh;border:1px solid var(--ring);border-radius:10px}

/* multiselect */
.ms{position:relative}
.ms>button{min-width:210px;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:8px}
.ms>button .cnt{background:var(--blue);color:#fff;border-radius:99px;font-size:10.5px;padding:0 7px;font-weight:700}
.mspanel{position:absolute;z-index:30;top:calc(100% + 4px);left:0;min-width:300px;max-height:340px;overflow:auto;
  background:var(--surface-1);border:1px solid var(--baseline);border-radius:10px;box-shadow:var(--shadow);padding:8px;display:none}
.ms.on .mspanel{display:block}
.mspanel label{display:flex;align-items:center;gap:8px;padding:5px 7px;border-radius:6px;font-size:13px;cursor:pointer}
.mspanel label:hover{background:var(--surface-2)}
.mspanel input{width:15px;height:15px;min-height:auto;margin:0}
.mspanel .acts{display:flex;gap:6px;padding:4px 3px 8px;border-bottom:1px solid var(--grid);margin-bottom:5px}
.mspanel .acts button{padding:3px 9px;font-size:11.5px;border-radius:6px}
.seg{display:inline-flex;border:1px solid var(--baseline);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:7px 13px;font-size:13px;background:var(--surface-1)}
.seg button+button{border-left:1px solid var(--baseline)}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff}
/* ficha editable */
.ficha{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:10px;margin-top:4px}
.fld2{display:flex;flex-direction:column;gap:3px}
.fld2 label{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-muted);font-weight:700}
.fld2 input,.fld2 select{padding:6px 8px;font-size:13px;min-height:32px}
.fld2 input:focus,.fld2 select:focus{outline:2px solid var(--blue);outline-offset:-1px}
/* comentarios */
.cmt{border-left:2px solid var(--grid);padding:0 0 0 12px;margin:8px 0 0}
.cmt .one{padding:7px 0;border-bottom:1px solid var(--grid)}
.cmt .one:last-child{border-bottom:0}
.cmt .hd2{font-size:11px;color:var(--ink-muted);font-weight:650;margin-bottom:2px}
.cmt .tx{font-size:13px;white-space:pre-wrap}
.addc{display:flex;gap:8px;align-items:flex-start;margin-top:10px}
.addc textarea{flex:1;min-height:56px;resize:vertical;font:inherit;padding:7px 9px;border:1px solid var(--baseline);border-radius:8px;background:var(--surface-1);color:var(--ink-1)}
/* replan badge */
.rp{display:inline-flex;align-items:center;gap:3px;background:var(--warning-tint);color:var(--warning-ink);
  border:1px solid var(--warning);border-radius:99px;font-size:10.5px;font-weight:700;padding:0 7px;margin-left:6px}
.modcard summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;padding:2px 0}
.modcard summary::-webkit-details-marker{display:none}
.modcard summary .caret{color:var(--ink-muted);font-size:12px;width:14px}
.modcard[open] summary{margin-bottom:12px;border-bottom:1px solid var(--grid);padding-bottom:10px}
.h2{font-size:19px;font-weight:670;letter-spacing:-.02em}
.mini2{font-size:11.5px;color:var(--ink-2)}

/* ===== gantt editable ===== */
.gwrap2{overflow:auto;max-height:70vh;border:1px solid var(--ring);border-radius:10px;background:var(--surface-1)}
table.gg{border-collapse:separate;border-spacing:0;font-size:11px;width:max-content;min-width:100%}
.gg th,.gg td{padding:0;margin:0}
.gg .hmes{position:sticky;top:0;z-index:6;background:var(--surface-2);color:var(--ink-2);font-size:10px;
  text-transform:uppercase;letter-spacing:.08em;font-weight:700;height:22px;text-align:center;border-bottom:1px solid var(--grid)}
.gg .hday{position:sticky;top:22px;z-index:6;background:var(--surface-1);border-bottom:1px solid var(--baseline);
  height:30px;width:32px;min-width:32px;text-align:center;vertical-align:middle}
.gg .hday .n{font-size:11px;font-weight:650;font-variant-numeric:tabular-nums;display:block;line-height:1.05}
.gg .hday .w{font-size:9px;color:var(--ink-muted);display:block;line-height:1.05}
.gg .hday.we{background:var(--surface-2)}
.gg .hday.hoy{box-shadow:inset 0 -3px 0 var(--critical)}
.gg .sk{position:sticky;left:0;z-index:7;background:var(--surface-1);border-right:1px solid var(--baseline);
  width:210px;min-width:210px;padding:2px 8px !important;font-size:11.5px;vertical-align:middle;line-height:1.25}
.gg th.sk{z-index:9}
.gg .sk .et{display:block;font-size:9.5px;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.04em}
.gg .lane{position:sticky;left:378px;z-index:7;background:var(--surface-1);border-right:1px solid var(--baseline);
  width:48px;min-width:48px;font-size:9px;font-weight:700;letter-spacing:.05em;text-align:center;
  color:var(--ink-muted);text-transform:uppercase;vertical-align:middle}
.gg th.lane{z-index:9}
.gg .cel{height:22px;width:32px;min-width:32px;border-right:1px solid var(--grid);position:relative;vertical-align:middle}
.gg .cel.we{background:var(--surface-2)}
.gg tr.rb td{border-top:1px solid var(--grid)}
.gg .todayl{position:absolute;top:0;bottom:0;width:2px;background:var(--critical);left:50%;z-index:1;opacity:.65}
.bb,.ba{position:absolute;inset:3px 2px;border-radius:4px;display:flex;align-items:center;justify-content:center;
  font-size:8.5px;font-weight:700;overflow:hidden;white-space:nowrap;letter-spacing:-.02em;z-index:3}
.bb{background:var(--neutral-b);color:var(--neutral-bi)}
.ba{cursor:grab;box-shadow:0 0 0 1px var(--surface-1)}
.ba:active{cursor:grabbing}
.ba.ok{background:var(--blue);color:#fff}
.ba.done{background:var(--good);color:#fff}
.ba.warnb{background:var(--warning);color:#3d2c00}
.ba.badb{background:var(--critical);color:#fff}
.ba.mv{outline:2px dashed var(--ink-1);outline-offset:-2px}
.ba:hover{filter:brightness(1.13);z-index:5}
.cel.drop{background:var(--blue-tint) !important;box-shadow:inset 0 0 0 2px var(--blue)}
.trail2{position:absolute;top:50%;height:0;border-top:1.5px dashed var(--ink-muted);z-index:2}
.trail2::after{content:'';position:absolute;right:-1px;top:-3px;border-left:5px solid var(--ink-muted);
  border-top:3px solid transparent;border-bottom:3px solid transparent}
.trail2.bk::after{right:auto;left:-1px;border-left:0;border-right:5px solid var(--ink-muted)}
:root{--neutral-b:#c9c8c2;--neutral-bi:#3d3c39}
:root[data-theme="dark"]{--neutral-b:#4a4a47;--neutral-bi:#d6d5cf}
.gg .dt{position:sticky;left:210px;z-index:7;background:var(--surface-1);border-right:1px solid var(--baseline);
  width:168px;min-width:168px;padding:3px 8px !important;vertical-align:middle}
.gg th.dt{z-index:9;font-size:9px;letter-spacing:.06em;color:var(--ink-muted);font-weight:700;text-align:left}
.det{display:flex;flex-direction:column;gap:1px}
.dl{display:flex;align-items:baseline;gap:5px;font-size:10.5px;line-height:1.25}
.dl span{color:var(--ink-muted);font-weight:700;width:26px;font-size:9px;letter-spacing:.04em}
.dl b{font-variant-numeric:tabular-nums;font-size:12px}
.dl i{font-style:normal;color:var(--ink-muted);font-size:9.5px}
.dbar{height:4px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:3px}
.dbar div{height:100%;background:var(--blue)}
.dfl{display:flex;gap:4px;margin-top:3px}
/* ===== agenda ===== */
table.ag{border-collapse:separate;border-spacing:2px;font-size:11.5px;width:max-content;min-width:100%}
table.ag th{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-muted);font-weight:700;padding:3px 6px;text-align:center;white-space:nowrap}
table.ag th.dd{text-align:left;min-width:112px;color:var(--ink-1);font-size:11.5px;text-transform:none;letter-spacing:0}
table.ag td{padding:5px 4px;text-align:center;border-radius:6px;background:var(--surface-2);min-width:82px;
  font-variant-numeric:tabular-nums;line-height:1.2}
table.ag td.baja{background:var(--good-tint);color:var(--good-ink)}
table.ag td.media{background:var(--warning-tint);color:var(--warning-ink)}
table.ag td.alta{background:var(--critical);color:#fff}
table.ag td.vac{background:transparent;color:var(--ink-muted)}
table.ag td b{font-size:14px;display:block;line-height:1.05}
table.ag td i{font-style:normal;font-size:9.5px;opacity:.85}
table.ag td.tot{background:var(--blue-tint);color:var(--blue);font-weight:700}
.hue{display:flex;gap:3px;justify-content:center;flex-wrap:wrap}
.hue span{font-size:9.5px;border-radius:4px;padding:1px 5px;font-weight:700}
.hue .li{background:var(--good-tint);color:var(--good-ink);border:1px solid var(--good)}
.hue .oc{background:var(--surface-2);color:var(--ink-muted);border:1px solid var(--baseline);text-decoration:line-through}
.btnbit{font-size:12px;padding:5px 11px;border-radius:8px}
.chk3{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:650;cursor:pointer;
  border:1px solid var(--baseline);border-radius:99px;padding:1px 9px 1px 6px;background:var(--surface-1);white-space:nowrap}
.chk3 input{width:13px;height:13px;min-height:auto;margin:0}
.chk3.on{background:var(--good-tint);border-color:var(--good);color:var(--good-ink)}
.tipopi{display:inline-block;font-size:10px;font-weight:700;border-radius:4px;padding:1px 6px;margin-right:5px;
  background:var(--blue-tint);color:var(--blue);border:1px solid var(--blue)}
.snap td,.snap th{font-size:12px}
.bp{position:absolute;inset:3px 2px;border-radius:4px;display:flex;align-items:center;justify-content:center;
  font-size:8.5px;font-weight:700;z-index:3;background:var(--warning-tint);color:var(--warning-ink);
  border:1.5px dashed var(--warning)}
.bp.vencido{background:var(--critical-tint);color:var(--critical);border-color:var(--critical)}
.salud{display:inline-flex;align-items:center;gap:6px;padding:3px 12px;border-radius:99px;font-size:13px;font-weight:700}
.salud.v{background:var(--good-tint);color:var(--good-ink);border:1px solid var(--good)}
.salud.a{background:var(--warning-tint);color:var(--warning-ink);border:1px solid var(--warning)}
.salud.r{background:var(--critical);color:#fff}
.big{font-size:40px;font-weight:680;letter-spacing:-.03em;line-height:1}
.gap{display:flex;align-items:center;gap:10px;margin-top:6px}
.gapbar{flex:1;height:12px;border-radius:99px;background:var(--surface-2);position:relative;overflow:hidden}
.gapbar .real{position:absolute;left:0;top:0;bottom:0;background:var(--blue);border-radius:99px}
.gapbar .esp{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink-1)}
@media print{.bar,.tabs,.x,#segVista,.btnbit,button{display:none !important}
  .card{break-inside:avoid;box-shadow:none;border:1px solid #ccc}
  #mods,#gantt,#agenda{display:none !important} #informe{display:block !important}}
/* ===== drawer ===== */
.scrim{position:fixed;inset:0;background:rgba(11,11,11,.45);opacity:0;pointer-events:none;transition:opacity .16s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drw{position:fixed;top:0;right:0;width:min(560px,100%);height:100%;background:var(--surface-1);
  border-left:1px solid var(--ring);box-shadow:-8px 0 32px rgba(11,11,11,.2);z-index:41;
  transform:translateX(100%);transition:transform .18s ease;overflow:auto;padding:18px 20px 30px}
.drw.on{transform:none}
.drw .x{border:0;background:none;font-size:23px;line-height:1;color:var(--ink-muted);cursor:pointer;padding:0 4px}
.drw h3{margin:0;font-size:17px;letter-spacing:-.015em}
.rowf{display:flex;flex-direction:column;gap:4px;margin-bottom:11px}
.rowf label{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-muted);font-weight:700}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.drw textarea{min-height:60px;resize:vertical;font:inherit;padding:7px 9px;border:1px solid var(--baseline);
  border-radius:8px;background:var(--surface-1);color:var(--ink-1)}
.hist{border-left:2px solid var(--warning);padding-left:11px;margin:10px 0 0}
.hist .h1x{font-size:11px;color:var(--ink-muted);font-weight:650}
.hist .b1{padding:6px 0;border-bottom:1px solid var(--grid);font-size:12.5px}
.hist .b1:last-child{border-bottom:0}
/* ===== captura ===== */
.capt .act{border-bottom:1px solid var(--grid);padding:9px 0}
.capt .act:last-child{border-bottom:0}
.capt .ttl{font-size:13px;font-weight:600;margin-bottom:2px}
.capt .sub2{font-size:11.5px;color:var(--ink-2);margin-bottom:6px}
.rg{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:5px}
.rg button{padding:4px 11px;font-size:12px;border-radius:99px;font-weight:650}
.rg button[aria-pressed="true"].bOK{background:var(--good);border-color:var(--good);color:#fff}
.rg button[aria-pressed="true"].bHAL{background:var(--warning);border-color:var(--warning);color:#3d2c00}
.rg button[aria-pressed="true"].bBLO{background:var(--critical);border-color:var(--critical);color:#fff}
.rg button[aria-pressed="true"].bNA{background:var(--ink-muted);border-color:var(--ink-muted);color:#fff}
.capt input.cm{width:100%;font-size:12.5px;padding:5px 8px}

function leerEvidencia(file, cb){

     fecha:hoyISO(), quien:'', data});
  const fr=new FileReader();

    if(!esImg){
      if(kb>MAX_KB){alert(`«${file.name}» pesa ${(kb/1024).toFixed(1)} MB y el tope por archivo es 6 MB.\nSúbelo a Drive y anota la ruta en las observaciones del caso.`);return}
      return fin(fr.result, kb);
    }
    const img=new Image();
    img.onload=()=>{
      const max=1600, esc=Math.min(1, max/Math.max(img.width,img.height));
      const c=document.createElement('canvas');
      c.width=Math.round(img.width*esc); c.height=Math.round(img.height*esc);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      const d=c.toDataURL('image/jpeg',0.75);
      const kb2=Math.round(d.length*0.75/1024);
      if(kb2>MAX_KB){alert(`«${file.name}» sigue pesando ${(kb2/1024).toFixed(1)} MB después de reescalar.`);return}
      fin(d, kb2);
    };
    img.onerror=()=>fin(fr.result, kb);
    img.src=fr.result;
  };
  fr.readAsDataURL(file);
}

  const pCasosTot=proc.reduce((a,p)=>a+p.casos,0);
  const pBloq=proc.reduce((a,p)=>a+p.bloq,0);
  const pFirm=proc.filter(p=>p.firmada).length;
  const pConMeta=proc.filter(p=>p.meta>0).length;
  const pSinLider=proc.filter(p=>!p.lider).length;
  const pListas=proc.filter(p=>p.meta>0 && p.casos>=p.meta && p.bloq===0 && p.actOk && p.evi>0 && !p.firmada).length;
  const pSinEvi=proc.filter(p=>p.meta>0 && p.casos>0 && p.evi===0).length;
  const pEvi=proc.reduce((a,p)=>a+p.evi,0);
  return {pfEjecN,libN,ses,ejec,acts,cap,ok,par,actVenc,pis,hab,piVenc,modsReq,modsListos,repl,mov,
    proc,cerrados,enCurso,sinIni,sinLevN,nProc:proc.length,
    pMeta,pCasos,pCasosTot,pBloq,pFirm,pConMeta,pSinLider,pListas,pSinEvi,pEvi,
    pract: pMeta? pCasos/pMeta : null,
    pf:    prom('av'),                                  // avance real de PF · promedio por proceso
    pfEsp: prom('esp'),                                 // esperado de PF a la fecha · misma base
    pfCer: proc.length? cerrados/proc.length : null,     // procesos cerrados sobre el total
    pfAct: acts.length? ok/acts.length : null,           // detalle: actividades probadas
    pfSes: ses.length? ejec/ses.length : null,           // ejecución de sesiones (no es avance)
    pi:    pis.length? hab/pis.length : null,            // avance real de PI
    piEsp: pis.length? piVenc/pis.length : null};        // esperado de PI a la fecha

function ventana(m){
  const base=sesVis(m).map(s=>s.fecha); if(!base.length) base.push(HOY);
  const f=base.concat([HOY]).sort();
  let a=new Date(d(f[0]).getTime()-864e5), b=new Date(d(f[f.length-1]).getTime()+864e5);
  const out=[]; let c=new Date(a);
  while(c<=b){out.push(iso(c)); c=new Date(c.getTime()+864e5)}
  return out.slice(0,50);
}

      habPI:!!m.habPI, pi:m.pi||[], acr:m.acr||{},

      casos:(m.casos||[]).map(c=>({...c})), faltantes:(m.faltantes||[]).map(f=>({...f})),
      sesiones:m.sesiones.map(s=>({id:s.id, ses:s.ses, clase:s.clase, tipo:s.tipo, fecha:s.fecha,
        hi:s.hi, hf:s.hf, resp:s.resp, estado:s.estado, nota:s.nota||'',

const SNAP_URL='/api/snapshot';
function normalizaSnap(snap){
  if(Array.isArray(snap)){
    return {app:'Tablero PF Alpha', esquema:1, generado:'', mods:snap.map(x=>({pf:x.pf, ficha:x.ficha||{},
      comentarios:x.comentarios||[], sesiones:(x.sesiones||[]).map(y=>({...y,id:y.id||''})),
      grupos:[{etapa:'(importado)', items:(x.act||[]).map(a=>({...a, sello:''}))}]}))};
  }
  return snap;
}
async function guardarCompartido(){
  const snap=snapshot();
  const r=await fetch(SNAP_URL,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(snap)});
  if(!r.ok){
    const t=await r.text().catch(()=> '');
    throw new Error((t&&t.slice(0,180))||('HTTP '+r.status));
  }
}
async function cargarCompartido(){
  try{
    const r=await fetch(SNAP_URL,{cache:'no-store'});
    if(r.status===204||r.status===404) return false;
    if(!r.ok) return false;
    const snap=normalizaSnap(await r.json());
    if(!snap||snap.app!=='Tablero PF Alpha') return false;
    aplica(snap,'reemplazar',true);
    return true;
  }catch(e){ return false; }
}

/* ---- índices y comparación ---- */
const idxAct=()=>{const o={}; MODS.forEach(m=>m.grupos.forEach(g=>g.items.forEach(i=>o[i.cod]=i))); return o};
const idxSes=()=>{const o={}; MODS.forEach(m=>m.sesiones.forEach(s=>o[m.pf+'|'+s.id]=s)); return o};

function analiza(snap){
  const A=idxAct(), S=idxSes(), r={nuevas:[],cambian:[],borrarian:[],iguales:0,desconocidas:[],
    sesCambian:[], pfDesconocidos:[], selloArch:'', masViejo:false};
  const campos=['res','com','accion','respP','fEnt','piTipo','piOrden'];
  const sellos=[];
  (snap.mods||[]).forEach(x=>{
    if(!MODS.some(m=>m.pf===x.pf)){r.pfDesconocidos.push(x.pf); return}
    (x.grupos||[]).forEach(g=>(g.items||[]).forEach(y=>{
      const it=A[y.cod];
      if(!it){r.desconocidas.push(y.cod); return}
      if(y.sello) sellos.push(y.sello);
      const dif=campos.filter(c=>(y[c]||'')!==(it[c]||''));
      if(!dif.length){r.iguales++; return}
      const info={cod:y.cod, dif, deRes:it.res||'', aRes:y.res||'',
                  selloArch:y.sello||'', selloAct:selloAct(it)};
      if(vacia(it)) r.nuevas.push(info);
      else if(!y.res && !y.com && !y.accion && it.res) r.borrarian.push(info);
      else r.cambian.push(info);
    }));
    r.casosArch=(r.casosArch||0)+((x.casos||[]).length);
    r.faltArch=(r.faltArch||0)+((x.faltantes||[]).length);
    r.eviArch=(r.eviArch||0)+(((x.pract||{}).evidencias||[]).length);
    (x.sesiones||[]).forEach(y=>{const s=S[x.pf+'|'+y.id];
      if(s && (s.fecha!==y.fecha||s.hi!==y.hi||s.resp!==y.resp||s.estado!==y.estado))
        r.sesCambian.push({pf:x.pf, ses:y.ses, de:s.fecha, a:y.fecha, deE:s.estado, aE:y.estado});});
  });
  r.selloArch = snap.generado||'';
  const mio = MODS.flatMap(m=>m.grupos.flatMap(g=>g.items)).map(selloAct).filter(Boolean).sort().pop()||'';
  r.selloMio = mio;
  r.masViejo = !!(mio && r.selloArch && r.selloArch < mio);
  r.sellosArchMax = sellos.sort().pop()||'';
  return r;
}

let RESPALDO=null;
function aplica(snap, modo, silencioso){
  RESPALDO=JSON.parse(JSON.stringify(MODS));
  const A=idxAct(), S=idxSes();
  const campos=['res','com','accion','respP','fEnt','piTipo','piOrden'];
  let tocadas=0, saltadas=0, ses=0;
  (snap.mods||[]).forEach(x=>{
    const m=MODS.find(z=>z.pf===x.pf); if(!m)return;
    /* ficha y comentarios: unión, nunca se pierden los que ya están */
    if(modo==='reemplazar'){ Object.assign(m.ficha, x.ficha||{}); m.comentarios=x.comentarios||[]; }
    else {
      Object.keys(x.ficha||{}).forEach(k=>{ if(!m.ficha[k] || modo==='combinar') m.ficha[k]=x.ficha[k]||m.ficha[k] });
      const clave=c=>`${c.fecha}|${c.autor}|${c.texto}`;
      const vistos=new Set((m.comentarios||[]).map(clave));
      (x.comentarios||[]).forEach(c=>{ if(!vistos.has(clave(c))){ (m.comentarios=m.comentarios||[]).push(c); vistos.add(clave(c)) } });
    }
    (x.grupos||[]).forEach(g=>{
      const gr=m.grupos.find(z=>z.etapa===g.etapa); if(gr && ('lib' in g)) gr.lib = modo==='reemplazar'? !!g.lib : (gr.lib||!!g.lib);
      (g.items||[]).forEach(y=>{
        const it=A[y.cod]; if(!it)return;
        const dif=campos.some(c=>(y[c]||'')!==(it[c]||'')); if(!dif)return;
        const sa=y.sello||'', sm=selloAct(it);
        if(modo==='complementar'){
          /* campo por campo: un hueco siempre se llena, venga el archivo de cuando venga.
             Solo para sobreescribir un campo que ya tiene texto se exige que el archivo sea
             mas reciente que el renglon. Asi nunca se pierde lo capturado ni se descarta
             una captura nueva por un sello ajeno en otra columna del mismo renglon. */
          let n=0;
          campos.forEach(c=>{
            if(!y[c]) return;
            if(!(it[c]||'')) { it[c]=y[c]; n++; return }
            if(y[c]!==it[c] && sa && sa>sm){ it[c]=y[c]; n++ }
          });
          if(!n){saltadas++; return}
          if(sa>(it.sello||'')) it.sello=sa; else if(!it.sello) it.sello=ahoraISO();
          tocadas++; return;
        }
        const ok = modo==='reemplazar' ? true : (!sm || (sa && sa>sm));
        if(!ok){saltadas++; return}
        campos.forEach(c=>{ it[c]=y[c]||'' });
        it.sello = sa||ahoraISO(); tocadas++;
      });
    });
    (x.sesiones||[]).forEach(y=>{
      const s=S[x.pf+'|'+y.id]; if(!s)return;
      const cambia = s.fecha!==y.fecha||s.hi!==y.hi||s.hf!==y.hf||s.resp!==y.resp||s.estado!==y.estado;
      if(modo==='complementar' && s.estado==='Ejecutada' && y.estado!=='Ejecutada') return; // no se degrada una sesión ya dada
      if(cambia){ Object.assign(s,{fecha:y.fecha,hi:y.hi,hf:y.hf,resp:y.resp,estado:y.estado,nota:y.nota||s.nota}); ses++ }
      const k=c=>`${c.reg}|${c.de}|${c.a}`; const v=new Set((s.cambios||[]).map(k));
      (y.cambios||[]).forEach(c=>{ if(!v.has(k(c))){ (s.cambios=s.cambios||[]).push(c); v.add(k(c)) } });
      if(y.base && !s.base) s.base=y.base;
    });
    /* prácticas: los casos y faltantes se fusionan por clave; nunca se borran en modo complementar */
    if(x.pract){
      const P=m.pract||(m.pract={}); const sa=x.pract.sello||'', sm=P.sello||'';
      const gana = modo==='reemplazar' || (sa && sa>sm) || !sm;
      ['resp','reps','r0','r1','cierre','notas','estado','bitNombre','bitCasos'].forEach(k=>{
        if(x.pract[k]===undefined) return;
        if(modo==='complementar'){ if(!P[k] && x.pract[k]) P[k]=x.pract[k] }
        else if(gana) P[k]=x.pract[k];
      });
      if(modo==='reemplazar') P.firmada=!!x.pract.firmada;
      else if(x.pract.firmada) P.firmada=true;
      const ke=e=>`${e.nombre||''}|${e.kb||0}`;
      if(x.pract.evidencias){
        if(modo==='reemplazar') P.evidencias=x.pract.evidencias.map(e=>({...e}));
        else { const v=new Set((P.evidencias||[]).map(ke));
          x.pract.evidencias.forEach(e=>{ if(!v.has(ke(e))){ (P.evidencias=P.evidencias||[]).push({...e}); v.add(ke(e)) } }); }
      }
      if(sa && sa>sm) P.sello=sa;
    }
    if(x.casos){
      const k=c=>`${c.qad||''}|${c.odoo||''}|${c.codigo||''}|${c.fecha||''}`;
      if(modo==='reemplazar') m.casos=x.casos.map(c=>({...c}));
      else { const v=new Set((m.casos||[]).map(k));
        x.casos.forEach(c=>{ if(!v.has(k(c))){ (m.casos=m.casos||[]).push({...c}); v.add(k(c)) } }); }
    }
    if(x.faltantes){
      const k=f=>`${f.caso||''}|${f.tipo||''}|${f.elem||''}|${(f.desc||'').slice(0,40)}`;
      if(modo==='reemplazar') m.faltantes=x.faltantes.map(f=>({...f}));
      else { const v=new Set((m.faltantes||[]).map(k));
        x.faltantes.forEach(f=>{ if(!v.has(k(f))){ (m.faltantes=m.faltantes||[]).push({...f}); v.add(k(f)) } }); }
    }
    if(x.habPI) m.habPI = modo==='reemplazar'? !!x.habPI : (m.habPI||!!x.habPI);
    m.grupos.forEach(gr=>gr.items.forEach(it=>{const ss=m.sesiones.find(z=>z.id===it.sesid); if(ss){it.fecha=ss.fecha; it.ses=ss.ses}}));
  });
  render();
  if(silencioso) return;
  abrir(`<div class="stik"><div style="display:flex;justify-content:space-between"><div>
      <h3>Carga aplicada</h3><div class="mini2">Modo: ${modo==='complementar'?'complementar (no destructivo)':modo==='combinar'?'combinar por fecha':'reemplazar todo'}</div>
      </div><button class="x" id="dx">×</button></div></div>
    <div class="capt"><div class="act"><div class="ttl">${tocadas} actividades actualizadas</div>
      <div class="sub2">${saltadas} se dejaron como estaban porque el tablero tenía información más reciente. ${ses} sesiones ajustadas.</div></div>
      <div class="act"><div class="ttl">¿No era lo que esperabas?</div>
      <div class="sub2">Puedes deshacer esta carga y volver al estado anterior.</div>
      <div class="rg"><button id="undo">Deshacer la carga</button></div></div></div>`);
  document.getElementById('dx').onclick=cerrar;
  document.getElementById('undo').onclick=()=>{
    if(!RESPALDO)return;
    MODS.length=0; JSON.parse(JSON.stringify(RESPALDO)).forEach(m=>MODS.push(m));
    RESPALDO=null; render(); cerrar(); alert('Se restauró el estado anterior a la carga.');
  };
}

MODS.forEach(m=>m.sesiones.forEach(s=>{ if(!s.base) s.base={fecha:s.fecha,hi:s.hi,hf:s.hf,resp:s.resp} }));
const mn=t=>{const[h,m]=t.split(':').map(Number);return h*60+m};
const LIMDIA=5;   // tope planeado: 4 sesiones en la pista de Luis + 1 en paralelo
function conflictos(){
  const all=MODS.flatMap(m=>m.sesiones.map(s=>({m,s})));
  const porDia={};
  all.forEach(r=>{(porDia[r.s.fecha] ||= []).push(r)});
  all.forEach(r=>{r.s.conf=null});
  all.forEach(r=>{
    const dia=porDia[r.s.fecha]||[];
    /* una sesion combinada del calendario -- varios procesos en una sola reunion --
       no se encima consigo misma: se excluyen los companeros de la misma combinacion */
    const ov=dia.filter(o=>o!==r && mn(o.s.hi)<mn(r.s.hf) && mn(o.s.hf)>mn(r.s.hi)
      && !(r.s.comb && o.s.comb===r.s.comb));
    if(r.s.comb && !ov.length){
      const jun=dia.filter(o=>o!==r && o.s.comb===r.s.comb);
      if(jun.length) r.s.conf={t:'comb', tipo:'Sesión combinada',
        msg:`${r.s.comb}: una sola reunión el ${fmt(r.s.fecha)} que cubre ${jun.length+1} procesos (${jun.map(o=>o.m.pf).join(', ')} y este). No es un empalme.`};
    }
    else if(ov.length){
      const mismo=ov.filter(o=>o.s.resp===r.s.resp);
      r.s.conf={t:'dura',
        msg: mismo.length
          ? `${r.s.resp} conduce ${mismo.length+1} sesiones a la misma hora el ${fmt(r.s.fecha)}: ${mismo.map(o=>o.m.pf+' '+lblSes(o.s.ses)).join(', ')}`
          : `Se encima con ${ov.map(o=>o.m.pf+' '+lblSes(o.s.ses)+' ('+o.s.resp+')').join(', ')} el ${fmt(r.s.fecha)}. Luis Monzón no puede estar en las dos.`,
        tipo: mismo.length? 'Mismo consultor' : 'Agenda de Luis'};
    } else if(dia.length>LIMDIA){
      r.s.conf={t:'carga', tipo:'Carga del día',
        msg:`Ese día hay ${dia.length} sesiones en total, por encima del tope de ${LIMDIA}.`};
    }
  });
  return all;
}

function MESL(i){return ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'][i]}

function wireG(){
  const g=document.getElementById('gantt');
  g.querySelectorAll('.ba').forEach(b=>{
    b.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',b.dataset.pf+'|'+b.dataset.i);e.dataTransfer.effectAllowed='move'});
    b.addEventListener('click',()=>editorSesion(b.dataset.pf,+b.dataset.i));
  });
  g.querySelectorAll('td.cel[data-pf]').forEach(td=>{
    td.addEventListener('dragover',e=>{e.preventDefault();td.classList.add('drop')});
    td.addEventListener('dragleave',()=>td.classList.remove('drop'));
    td.addEventListener('drop',e=>{
      e.preventDefault(); td.classList.remove('drop');
      const [pf,i]=e.dataTransfer.getData('text/plain').split('|');
      if(pf!==td.dataset.pf) return;
      mover(pf,+i,{fecha:td.dataset.day});
    });
  });
}
/* aplica un cambio dejando pista */
function mover(pf,i,nuevo,motivoDado,solicitaDado){
  const m=MODS.find(x=>x.pf===pf), s=m.sesiones[i];
  const antes={fecha:s.fecha,hi:s.hi,hf:s.hf,resp:s.resp};
  const despues={...antes,...nuevo};
  if(JSON.stringify(antes)===JSON.stringify(despues)) return false;
  let motivo=motivoDado, solicita=solicitaDado;
  if(motivo===undefined){
    motivo=prompt(`¿Por qué se mueve la ${lblSes(s.ses)} de ${m.proceso}?\n${fmt(antes.fecha)} ${antes.hi}–${antes.hf} · ${antes.resp}\n→ ${fmt(despues.fecha)} ${despues.hi}–${despues.hf} · ${despues.resp}`,'');
    if(motivo===null) return false;
    solicita=prompt('¿Quién lo solicita? Cliente, Doer, Acuerdo mutuo o Causa externa','Cliente')||'Cliente';
  }
  s.cambios=s.cambios||[];
  s.cambios.push({reg:hoyISO(), de:antes.fecha, a:despues.fecha,
    deH:`${antes.hi}–${antes.hf}`, aH:`${despues.hi}–${despues.hf}`,
    deR:antes.resp, aR:despues.resp,
    motivo:motivo||'Sin motivo capturado', solicita:solicita||'Cliente', quien:'', estado:'Aplicado en el tablero'});
  Object.assign(s,despues);
  if(s.estado==='Planificada') s.estado='Reprogramada';
  m.grupos.forEach(gr=>gr.items.forEach(it=>{if(it.sesid===s.id) it.fecha=s.fecha}));
  render(); return true;
}

/* ================= CAPTURA DE RESULTADOS ================= */
const RESB=[['HECHA','Hecha','bOK'],['PARCIAL','Parcial','bHAL'],['','Pendiente','bNA']];
let CAP={pf:null, sid:null};
function captura(pf,sid){
  const L=vis(); if(!L.length){alert('Selecciona al menos un módulo.');return}
  CAP.pf = pf || CAP.pf || L[0].pf;
  if(!L.some(m=>m.pf===CAP.pf)) CAP.pf=L[0].pf;
  const m=MODS.find(x=>x.pf===CAP.pf);
  const demos=m.sesiones.filter(s=>m.grupos.some(g=>g.items.some(i=>i.sesid===s.id)));
  CAP.sid = sid || (demos.some(s=>s.id===CAP.sid)? CAP.sid : (demos[0]?demos[0].id:null));
  const items=m.grupos.flatMap(g=>g.items.filter(i=>!CAP.sid||i.sesid===CAP.sid).map(i=>({...i,etapa:g.etapa})));
  const con=items.filter(i=>i.res).length, ok=items.filter(i=>i.res==='HECHA').length;
  abrir(`<div class="stik">
     <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
       <div><h3>Capturar resultados</h3><div class="mini2">Marca cada actividad y añade comentario si hace falta.</div></div>
       <button class="x" id="dx">×</button></div>
     <div class="g2" style="margin-top:11px">
       <div class="rowf"><label>Módulo</label><select id="cM">${L.map(x=>`<option value="${x.pf}" ${x.pf===CAP.pf?'selected':''}>${esc(x.pf)} · ${esc(x.proceso)}</option>`).join('')}</select></div>
       <div class="rowf"><label>Sesión de PF</label><select id="cS">
         ${demos.length? demos.map(s=>`<option value="${s.id}" ${s.id===CAP.sid?'selected':''}>${lblSes(s.ses)} · ${fmt(s.fecha)}</option>`).join('')
                      : '<option value="">— sin actividades levantadas —</option>'}</select></div>
     </div>
     <div class="mini2" style="margin-top:8px">${ok} hechas · ${items.filter(i=>i.res==='PARCIAL').length} parciales · ${items.length-con} pendientes</div>
     <div class="pbar"><div style="width:${items.length?Math.round(con/items.length*100):0}%"></div></div>
   </div>
   <div class="capt">${ items.length? items.map(i=>`
     <div class="act">
       <div class="ttl"><span class="cod">${esc(i.cod)}</span>${esc(i.nombre)}</div>
       <div class="sub2">${esc(i.etapa)} · ${esc(i.odoo).slice(0,110)}</div>
       <div class="rg">${RESB.map(([v,t,c])=>`<button class="${c}" data-r="${i.cod}|${v}" aria-pressed="${i.res===v}">${t}</button>`).join('')}</div>
       <input class="cm" data-c="${i.cod}" value="${esc(i.com||'')}" placeholder="Comentario (opcional)">
     </div>`).join('') : '<div class="warn">Este proceso no tiene actividades levantadas en la matriz AS-IS.</div>'}</div>
   <div style="display:flex;gap:8px;margin-top:16px">
     <button id="cAll" style="flex:1">Marcar todas como hechas</button>
     <button id="cClr">Limpiar la sesión</button></div>`);
  document.getElementById('dx').onclick=cerrar;
  document.getElementById('cM').onchange=e=>{CAP.pf=e.target.value; CAP.sid=null; captura()};
  document.getElementById('cS').onchange=e=>{CAP.sid=e.target.value; captura()};
  const find=cod=>{let r=null; m.grupos.forEach(g=>g.items.forEach(i=>{if(i.cod===cod)r=i})); return r};
  drw.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{
    const [cod,v]=b.dataset.r.split('|'); const it=find(cod);
    it.res = it.res===v? '' : v; tocar(it); captura(); kpis();
  });
  drw.querySelectorAll('[data-c]').forEach(inp=>inp.onchange=()=>{const it=find(inp.dataset.c); it.com=inp.value; tocar(it)});
  document.getElementById('cAll').textContent='Marcar todas como hechas';
  document.getElementById('cAll').onclick=()=>{items.forEach(i=>{const it=find(i.cod); if(!it.res){it.res='HECHA'; tocar(it)}}); captura()};
  document.getElementById('cClr').onclick=()=>{if(!confirm('Esto borra el resultado y el comentario de las actividades de esta sesión. ¿Continuar?'))return; items.forEach(i=>{const it=find(i.cod); it.res=''; it.com=''; tocar(it)}); captura()};
}
document.getElementById('btnCap').onclick=()=>captura();

/* ================= AGENDA Y CARGA ================= */
const BLOQ=[['08:00','10:00'],['11:00','13:00'],['15:00','17:00']];
function vistaAgenda(){
  const L=vis();
  if(!L.length){document.getElementById('agenda').innerHTML='<div class="card"><div class="warn">Selecciona al menos un módulo.</div></div>';return}
  const S=L.flatMap(m=>sesVis(m).map(s=>({m,s})));
  const dias=[...new Set(S.map(r=>r.s.fecha))].sort();
  const cons=[...new Set(S.map(r=>r.s.resp))].sort();
  const horas=s=>(mn(s.hf)-mn(s.hi))/60;
  const clase=h=>h<=2?'baja':h<=4?'media':'alta';
  const lab=h=>h<=2?'baja':h<=4?'media':'alta';
  let filas=dias.map(f=>{
    const dd=S.filter(r=>r.s.fecha===f);
    const tds=cons.map(c=>{
      const mias=dd.filter(r=>r.s.resp===c);
      if(!mias.length) return '<td class="vac">—</td>';
      const hh=mias.reduce((a,r)=>a+horas(r.s),0);
      return `<td class="${clase(hh)}" title="${esc(mias.map(r=>r.m.pf+' '+lblSes(r.s.ses)+' '+r.s.hi+'–'+r.s.hf).join(' · '))}">
        <b>${hh}h</b><i>${mias.length} ses · carga ${lab(hh)}</i></td>`}).join('');
    const th=dd.reduce((a,r)=>a+horas(r.s),0);
    const libres=BLOQ.filter(([a,b])=>!dd.some(r=>mn(r.s.hi)<mn(b)&&mn(r.s.hf)>mn(a)));
    const o=d(f);
    return `<tr><th class="dd">${String(o.getDate()).padStart(2,'0')} ${MES[o.getMonth()]} <span class="mini">${WD[o.getDay()]}</span>${f===HOY?' <span class="chip" style="background:var(--critical-tint);border-color:var(--critical);color:var(--critical)">hoy</span>':''}</th>
      ${tds}
      <td class="tot"><b>${th}h</b><i>${dd.length} sesiones · carga ${lab(th)}</i></td>
      <td style="background:transparent"><div class="hue">${BLOQ.map(([a,b])=>{
        const lib=libres.some(x=>x[0]===a);
        return `<span class="${lib?'li':'oc'}">${a}</span>`}).join('')}</div>
        <i style="font-size:9.5px;color:var(--ink-muted)">${libres.length} de 3 bloques libres</i></td></tr>`}).join('');
  const totH=S.reduce((a,r)=>a+horas(r.s),0);
  const totLibres=dias.reduce((a,f)=>{const dd=S.filter(r=>r.s.fecha===f);
    return a+BLOQ.filter(([x,y])=>!dd.some(r=>mn(r.s.hi)<mn(y)&&mn(r.s.hf)>mn(x))).length},0);
  const alta=dias.filter(f=>{const dd=S.filter(r=>r.s.fecha===f); return dd.reduce((a,r)=>a+horas(r.s),0)>4}).length;
  document.getElementById('agenda').innerHTML=`<div class="card">
    <h1>Agenda y carga por consultor</h1>
    <p class="sub">Horas conducidas por día. La columna <b>Total del día</b> es tu agenda: asistes a todas las sesiones.
      Un día completo son tres bloques de dos horas — 08:00, 11:00 y 15:00 — es decir seis horas.</p>
    <div class="leg" style="margin:10px 0 4px">
      <span><span class="sw" style="background:var(--good-tint);color:var(--good-ink);border:1px solid var(--good);display:inline-flex;align-items:center;justify-content:center;width:44px;height:16px;border-radius:5px;font-size:9px;font-weight:700;margin-right:6px;vertical-align:-3px">≤ 2h</span>Carga baja</span>
      <span><span class="sw" style="background:var(--warning-tint);color:var(--warning-ink);border:1px solid var(--warning);display:inline-flex;align-items:center;justify-content:center;width:44px;height:16px;border-radius:5px;font-size:9px;font-weight:700;margin-right:6px;vertical-align:-3px">3–4h</span>Carga media</span>
      <span><span class="sw" style="background:var(--critical);color:#fff;display:inline-flex;align-items:center;justify-content:center;width:44px;height:16px;border-radius:5px;font-size:9px;font-weight:700;margin-right:6px;vertical-align:-3px">&gt; 4h</span>Carga alta</span>
      <span class="mini">${dias.length} días · ${S.length} sesiones · ${totH} horas · ${alta} días de carga alta · ${totLibres} bloques libres</span>
    </div>
    <div style="overflow:auto;max-height:66vh"><table class="ag"><thead><tr>
      <th class="dd">Día</th>${cons.map(c=>`<th>${esc(c)}</th>`).join('')}
      <th>Total del día</th><th>Huecos de agenda</th></tr></thead>
      <tbody>${filas}</tbody></table></div></div>`;
}


/* ================= ACTIVIDAD DE PRÁCTICAS =================
   No es una sesión ni un formulario de captura: es una actividad del proceso con
   responsable, ventana de fechas y un número de repeticiones. El detalle vive en la
   bitácora que el área llena y entrega; aquí solo se adjunta y se valida el conteo. */
let PRACT={pf:null, tab:'act'};
function practicas(pf, tab){
  const m=MODS.find(x=>x.pf===pf); if(!m) return;
  PRACT.pf=pf; if(tab) PRACT.tab=tab;
  const P=m.pract||(m.pract={resp:'',reps:0,r0:'',r1:'',cierre:'',estado:'Sin iniciar',
    bitNombre:'',bitCasos:0,firmada:false,notas:'',evidencias:[],sello:''});
  const it=m.grupos.flatMap(g=>g.items);
  const actOk=it.length>0 && it.every(i=>i.res==='HECHA');
  const nr=nReps(m), nc=nCasos(m), bloq=nBloq(m), fal=m.faltantes||[];
  const pc=nr? Math.min(100,Math.round(nc/nr*100)) : 0;
  const req=[['Sesiones de PF del proceso terminadas', actOk, `${it.filter(i=>i.res==='HECHA').length} de ${it.length} actividades`],
             ['Bitácora entregada con al menos las repeticiones acordadas', metaOk(m), `${nc} de ${nr||'—'} casos`],
             ['Sin faltantes bloqueantes abiertos', bloq===0, bloq? `${bloq} abierto(s)`:'ninguno'],
             ['Evidencia adjunta', nEvi(m)>0, nEvi(m)? `${nEvi(m)} archivo(s)`:'sin evidencia']];
  const sel=(arr,v,attr)=>`<select ${attr}><option value=""></option>`+
      arr.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')+'</select>';
  abrir(`<div class="stik">
     <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
       <div><h3>Actividad de prácticas · ${esc(m.proceso)}</h3>
         <div class="mini2">${esc(m.pf)} · ${esc(m.empresa)} · no es una sesión: es la ventana en la que el área repite el proceso por su cuenta</div></div>
       <button class="x" id="dx">×</button></div>
     <div class="mini2" style="margin-top:10px">${nc} de ${nr||'—'} repeticiones acreditadas en la bitácora · ${fal.length} faltante(s) · ${bloq} bloqueante(s)</div>
     <div class="pbar"><div style="width:${pc}%"></div></div>
     <div class="seg" style="margin-top:10px" id="pTabs">
       <button data-t="act" class="${PRACT.tab==='act'?'on':''}">La actividad</button>
       <button data-t="bit" class="${PRACT.tab==='bit'?'on':''}">Bitácora y evidencia (${nEvi(m)})</button>
       <button data-t="falt" class="${PRACT.tab==='falt'?'on':''}">Faltantes (${fal.length})</button>
       <button data-t="firma" class="${PRACT.tab==='firma'?'on':''}">Cierre</button>
     </div></div>
   <div class="capt" id="pBody"></div>`);
  const body=document.getElementById('pBody');

  if(PRACT.tab==='act'){
    body.innerHTML=`
      <div class="g2">
        <div class="rowf"><label>Responsable del área</label>
          <input id="aResp" value="${esc(P.resp||'')}" placeholder="Escribe el nombre de quien responde por las prácticas"></div>
        <div class="rowf"><label>Estado de la actividad</label>
          <select id="aEst">${ESTPR.map(e=>`<option ${e===(P.estado||'Sin iniciar')?'selected':''}>${e}</option>`).join('')}</select></div>
      </div>
      <div class="g2">
        <div class="rowf"><label>Fecha de inicio</label><input id="aR0" type="date" value="${P.r0||''}"></div>
        <div class="rowf"><label>Fecha de fin</label><input id="aR1" type="date" value="${P.r1||''}"></div>
      </div>
      <div class="g2">
        <div class="rowf"><label>Repeticiones a realizar</label><input id="aReps" type="number" min="0" max="60" value="${nr}"></div>
        <div class="rowf"><label>Ventana</label>
          <input value="${P.r0&&P.r1? habilesEntre(P.r0,P.r1)+' días hábiles' : 'sin fechas'}" disabled></div>
      </div>
      <div class="g2">
        <div class="rowf"><label>Cierre y firma</label><input id="aCie" type="date" value="${P.cierre||''}"></div>
        <div class="rowf"><label>Consultor que acompaña</label><input value="${esc(m.ficha.consultor||'')}" disabled></div>

        <div class="sub2">El acta de inicio deja por escrito que en ese momento terminan las sesiones de PF y arrancan las prácticas. El acta de cierre se emite cuando el área entrega la bitácora, y con ella empieza la evaluación para liberar las pruebas integrales.</div>

          <button id="aIni" style="background:var(--blue);border-color:var(--blue);color:#fff">Acta de inicio de prácticas</button>

  } else if(PRACT.tab==='bit'){

    const mb=(kbEvi(m)/1024).toFixed(1);
    const det=m.casos||[];

      <div class="act"><div class="ttl">Bitácora que llena el área</div>
        <div class="sub2">Se descarga en blanco, el área la llena durante la ventana de prácticas y se vuelve a subir aquí. Al subirla, el tablero cuenta los casos y verifica que sean al menos ${nr||'las'} repeticiones acordadas.</div>

          <button id="bBaja">Descargar la bitácora en blanco</button>

        <input type="file" id="bSubeF" accept=".xls,.csv,.html,.htm,text/csv" style="display:none">
        ${P.bitNombre? `<div class="${metaOk(m)?'leg':'warn'}" style="margin-top:10px">
            <b>${esc(P.bitNombre)}</b> · ${nc} caso(s) detectado(s) de ${nr||'—'} acordado(s).
            ${metaOk(m)? 'Cumple con la cantidad acordada.' : `<b style="color:var(--critical)">Faltan ${Math.max(0,nr-nc)} caso(s): no se puede cerrar la actividad.</b>`}</div>`
          : '<div class="warn" style="margin-top:10px">Todavía no se ha subido la bitácora llenada.</div>'}
      </div>
      ${det.length? `<div class="act"><div class="ttl">Casos detectados en la bitácora</div>
          <div class="tscroll" style="max-height:230px"><table class="tbl"><thead><tr>
            <th style="width:34px">#</th><th style="min-width:110px">Fecha</th><th style="min-width:130px">Orden QAD</th>
            <th style="min-width:150px">Cliente</th><th style="min-width:120px">Código</th>
            <th style="min-width:120px">Orden en Odoo</th></tr></thead><tbody>`
          + det.map((c,i)=>`<tr><td style="text-align:center">${i+1}</td><td>${c.fecha?fmt(c.fecha):''}</td>
              <td>${esc(c.qad||'')}</td><td>${esc(c.cliente||'')}</td><td>${esc(c.codigo||'')}</td>
              <td>${esc(c.odoo||'')}</td></tr>`).join('')
          + `</tbody></table></div>
          <div class="sub2" style="margin-top:8px">Lectura de solo consulta: el registro válido es el archivo entregado, no esta tabla.</div></div>` : ''}
      <div class="act"><div class="ttl">Bitácora en físico y otras evidencias</div>
        <div class="sub2">El escaneo o la foto de la bitácora firmada, y las capturas de los pedidos y documentos que generó Odoo.</div>
        <div class="rg" style="margin-top:10px"><button id="eAdd">Adjuntar archivo</button></div>
        <input type="file" id="eAddF" accept="application/pdf,image/*" multiple style="display:none">
        <div class="mini2" style="margin-top:8px">${EV.length} archivo(s) · ${mb} MB${kbEvi(m)>AVISO_KB?' · <b>el tablero se está haciendo pesado: deja en Drive los escaneos grandes</b>':''}</div>
      </div>
      ${EV.map((e,i)=>`<div class="act">
          <div class="ttl" style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
            <span style="word-break:break-all">${/^image\//.test(e.tipo)||/^data:image/.test(e.data||'')?'🖼':'📄'} ${esc(e.nombre)}</span>
            <span style="white-space:nowrap"><button data-evver="${i}">Ver</button>
              <button class="x" data-evdel="${i}">×</button></span></div>
          <div class="sub2">${e.kb<1024? e.kb+' KB' : (e.kb/1024).toFixed(1)+' MB'} · subida el ${fmt(e.fecha)}</div>
          <input class="cm" data-ev="${i}|quien" value="${esc(e.quien||'')}" placeholder="Quién entrega esta evidencia (opcional)">
        </div>`).join('')}
      <div class="leg">Las imágenes se reescalan a 1600 px y se recomprimen al subirlas. Tope por archivo: 6 MB. La bitácora acepta el .xls que baja de aquí y .csv; si es .xlsx, guárdala como .csv.</div>`;
    document.getElementById('bBaja').onclick=()=>bajarBitacora(pf);
    document.getElementById('bSube').onclick=()=>document.getElementById('bSubeF').click();
    document.getElementById('bSubeF').onchange=ev=>{
      const f=ev.target.files[0]; if(!f)return;
      const fr=new FileReader();
      fr.onload=()=>{
        const r=parseBitacora(String(fr.result), f.name);
        if(r.error){alert(r.error);return}
        m.casos=r.casos;
        P.bitNombre=f.name; P.bitCasos=r.casos.length; P.sello=ahoraISO();
        if(P.estado==='Sin iniciar'||P.estado==='En curso') P.estado='Bitácora entregada';
        const kf=x=>`${x.caso||''}|${x.tipo||''}|${x.elem||''}|${(x.desc||'').slice(0,40)}`;
        const v=new Set((m.faltantes||[]).map(kf)); let nf=0;
        (r.falt||[]).forEach(x=>{ if(!v.has(kf(x))){ (m.faltantes=m.faltantes||[]).push(x); v.add(kf(x)); nf++ } });
        const ok=r.casos.length>=nr;
        alert(`«${f.name}»\n\n${r.casos.length} caso(s) detectado(s) · ${nr} repetición(es) acordada(s)\n`+
              (ok? '✓ La bitácora cumple con la cantidad acordada.' : `✗ Faltan ${nr-r.casos.length} caso(s). No se podrá cerrar la actividad hasta completarla.`)+
              (nf? `\n\n${nf} faltante(s) nuevo(s) tomados de la hoja de faltantes.`:''));
        practicas(pf,'bit'); render();
      };
      fr.readAsText(f,'utf-8'); ev.target.value='';
    };
    document.getElementById('eAdd').onclick=()=>document.getElementById('eAddF').click();
    document.getElementById('eAddF').onchange=ev=>{
      const fs=[...ev.target.files]; if(!fs.length)return;
      let pend=fs.length;
      fs.forEach(f=>leerEvidencia(f, e=>{
        (P.evidencias=P.evidencias||[]).push(e); P.sello=ahoraISO();
        if(--pend<=0){ practicas(pf,'bit'); render() }
      }));
      ev.target.value='';
    };
    body.querySelectorAll('[data-ev]').forEach(e=>e.onchange=()=>{
      const [i,k]=e.dataset.ev.split('|'); P.evidencias[+i][k]=e.value; P.sello=ahoraISO()});
    body.querySelectorAll('[data-evver]').forEach(b=>b.onclick=()=>verEvidencia(P.evidencias[+b.dataset.evver]));
    body.querySelectorAll('[data-evdel]').forEach(b=>b.onclick=()=>{
      if(!confirm('¿Quitar esta evidencia?'))return;
      P.evidencias.splice(+b.dataset.evdel,1); P.sello=ahoraISO(); practicas(pf,'bit'); render()});

  } else if(PRACT.tab==='falt'){
    body.innerHTML=`<div class="tscroll"><table class="tbl"><thead><tr>
      <th style="width:60px">Caso</th><th style="min-width:170px">Tipo de faltante</th><th style="min-width:170px">Elemento afectado</th>
      <th style="min-width:260px">Descripción</th><th style="min-width:90px">¿Bloquea?</th>
      <th style="min-width:170px">Área responsable</th><th style="min-width:130px">Estatus</th>
      <th style="min-width:130px">Fecha de solución</th><th style="width:34px"></th></tr></thead><tbody>`
      + (fal.length? fal.map((f,i)=>`<tr${f.bloquea==='Sí'&&f.estatus!=='Resuelto'?' style="background:var(--critical-tint)"':''}>
          <td><input class="inl" type="number" min="1" data-fl="${i}|caso" value="${f.caso||''}"></td>
          <td>${sel(TF,f.tipo,`class="inl" data-fl="${i}|tipo"`)}</td>
          <td><input class="inl" data-fl="${i}|elem" value="${esc(f.elem||'')}"></td>
          <td><input class="inl" data-fl="${i}|desc" value="${esc(f.desc||'')}"></td>
          <td>${sel(['Sí','No'],f.bloquea,`class="inl" data-fl="${i}|bloquea"`)}</td>
          <td>${sel(AR,f.area,`class="inl" data-fl="${i}|area"`)}</td>
          <td>${sel(EF,f.estatus,`class="inl" data-fl="${i}|estatus"`)}</td>
          <td><input class="inl" type="date" data-fl="${i}|fsol" value="${f.fsol||''}"></td>
          <td><button class="x" data-fdel="${i}">×</button></td></tr>`).join('')
        : '<tr><td colspan="9" class="mini2" style="padding:14px">Sin faltantes. Se cargan solos al subir la bitácora, o se agregan a mano.</td></tr>')
      + `</tbody></table></div>
      <div style="display:flex;gap:8px;margin-top:14px">
        <button id="fAdd" style="flex:1;background:var(--blue);border-color:var(--blue);color:#fff">Agregar faltante</button></div>
      <div class="leg" style="margin-top:10px">Un faltante bloquea cuando impide terminar el caso. Mientras haya uno abierto, la actividad no se puede cerrar.</div>`;
    body.querySelectorAll('[data-fl]').forEach(e=>e.onchange=()=>{
      const [i,k]=e.dataset.fl.split('|'); (m.faltantes[+i]||{})[k]=e.value; P.sello=ahoraISO(); practicas(pf,'falt'); render()});
    body.querySelectorAll('[data-fdel]').forEach(b=>b.onclick=()=>{
      m.faltantes.splice(+b.dataset.fdel,1); P.sello=ahoraISO(); practicas(pf,'falt'); render()});
    document.getElementById('fAdd').onclick=()=>{
      (m.faltantes=m.faltantes||[]).push({caso:1,tipo:'',elem:'',desc:'',bloquea:'No',area:'',estatus:'Abierto',fsol:''});
      P.sello=ahoraISO(); practicas(pf,'falt'); render()};

  } else {
    body.innerHTML=`<div class="act"><div class="ttl">Requisitos para cerrar las prácticas</div>
      <table class="tbl" style="margin-top:8px"><tbody>${req.map(([t,ok,d])=>`<tr>
        <td style="width:30px;text-align:center;font-size:15px">${ok?'✓':'○'}</td>
        <td>${t}</td><td class="mini2" style="text-align:right">${esc(d)}</td></tr>`).join('')}</tbody></table></div>
      <div class="act"><div class="ttl">Notas del cierre</div>
        <textarea id="pNot" rows="4" style="width:100%" placeholder="Acuerdos de la sesión de cierre, alcance de lo firmado, salvedades">${esc(P.notas||'')}</textarea></div>
      <div class="act"><div class="ttl">Cierre de prácticas y firma</div>
        <div class="sub2">Al cerrar se emite el acta de cierre, se liberan las etapas del módulo y arranca la evaluación para habilitar las pruebas integrales.</div>
        <div class="rg" style="margin-top:8px">
          <button id="pFirm" class="${P.firmada?'bOK':''}" ${puedeFirmar(m)||P.firmada?'':'disabled'}>
            ${P.firmada?'Prácticas cerradas — reabrir':'Cerrar las prácticas y firmar'}</button>
          <button id="pActa">Descargar el acta de cierre${P.firmada?'':' (borrador)'}</button></div></div>`;
    document.getElementById('pNot').onchange=e=>{P.notas=e.target.value; P.sello=ahoraISO()};
    document.getElementById('pFirm').onclick=()=>{
      if(!P.firmada && !puedeFirmar(m)){alert('Faltan requisitos para cerrar.');return}
      P.firmada=!P.firmada; P.sello=ahoraISO();
      P.estado = P.firmada? 'Cerrada' : 'Bitácora entregada';
      if(P.firmada) m.grupos.forEach(g=>g.lib=true);
      practicas(pf,'firma'); render()};
    document.getElementById('pActa').onclick=()=>actaPractica(pf,'cierre');
  }
  document.getElementById('dx').onclick=cerrar;
  document.getElementById('pTabs').querySelectorAll('button').forEach(b=>b.onclick=()=>practicas(pf,b.dataset.t));
}

/* ============================ ACTAS DE PRÁCTICAS ============================
   El acta no es un trámite: es el documento con el que el área entiende en qué
   punto del proyecto está, qué mecanismo va a operar, qué le va a cambiar y por

/* --- lo que de verdad va a cambiarle al área, deducido de sus propios pendientes --- */
function cambiosDelProceso(m){
  const it=m.grupos.flatMap(g=>g.items);
  const txt=it.map(i=>((i.com||'')+' '+(i.accion||'')).toLowerCase()).join(' | ');
  const TEMAS=[

    [/lote|serie|trazab/, 'El lote deja de ser un dato en la libreta: el sistema lo exige al mover el material y con eso queda la trazabilidad completa.'],
    [/vale|receptor|surtimiento/, 'El vale y el receptor se imprimen del propio movimiento, con folio y responsable: ya no se llenan a mano.'],
    [/merma|desperdicio|scrap|destrucci/, 'La merma se registra como tal y afecta el costo de la orden. Lo que antes se ajustaba, ahora se explica.'],
    [/recepci|parcial|pedimento|guia/, 'Las entregas parciales se registran como parciales: el saldo pendiente queda visible sin llevarlo aparte.'],
    [/reporte|plantilla|formato/, 'Los reportes salen del sistema como vistas guardadas. El Excel paralelo deja de ser la fuente.'],
    [/fecha de entrega|horario|atras/, 'La fecha de entrega la calcula el sistema desde la confirmación. Se termina la negociación de fechas caso por caso.'],
    [/lista de materiales|\bldm\b|\bbom\b|componente/, 'La lista de materiales queda cargada una vez y la orden la explota sola.'],
    [/alta de (producto|articulo)|catalogo|articulo/, 'El alta de producto pasa por una solicitud con responsable y plazo: nadie da de alta por su cuenta.'],
    [/reoperacion|retrabajo|cambio de instruccion/, 'Reoperación y cambio de instrucción se registran distinto, porque cuestan distinto.'],
    [/intercompa/, 'Las operaciones entre TGS y Litho generan su documento espejo solas: se acaba la captura doble.'],
  ];
  const out=[];
  TEMAS.forEach(([re,t])=>{ if(re.test(txt) && out.length<5) out.push(t) });
  if(!out.length) out.push('El proceso se opera completo dentro del sistema, con el registro de cada paso donde ocurre y no al final del día.');
  return out;
}

function actaPractica(pf, tipo){
  const m=MODS.find(x=>x.pf===pf); if(!m) return;
  const P=m.pract||{}, it=m.grupos.flatMap(g=>g.items);
  const ses=(m.sesiones||[]).filter(s=>s.estado!=='Cancelada');
  const nr=nReps(m), nc=nCasos(m);
  const ini=tipo==='inicio';
  const F='font-family:Arial;', B='border:.5pt solid #A6A6A6;padding:5px;'+F;
  const AZ='#1F3864', AZM='#2E5496', GT='#595959';
  const fila=(k,v)=>`<tr><td style="${B}background:#F2F2F2;font-size:10pt;font-weight:bold;width:30%">${esc(k)}</td>
     <td style="${B}font-size:10pt">${v}</td></tr>`;
  const H2=t=>`<p style="${F}font-size:12pt;font-weight:bold;color:${AZ};margin:20px 0 6px">${t}</p>`;
  const H3=t=>`<p style="${F}font-size:10.5pt;font-weight:bold;color:${AZM};margin:14px 0 4px">${t}</p>`;
  const p=t=>`<p style="${F}font-size:10.5pt;margin:0 0 8px;text-align:justify">${t}</p>`;
  const caja=(t,bg,bd,col)=>`<table cellspacing="0" style="width:100%;margin:12px 0"><tr>
     <td style="border:1pt solid ${bd};background:${bg};padding:9px;${F}font-size:10.5pt;color:${col||'#000'}">${t}</td></tr></table>`;
  const etapas=m.grupos.map(g=>`${esc(g.etapa)} (${g.items.length})`).join(' · ');
  const conf=it.filter(i=>i.res==='HECHA').length;
  const ejec=ses.filter(s=>s.estado==='Ejecutada').length;
  const dh=(P.r0&&P.r1)?habilesEntre(P.r0,P.r1):null;
  const rest=(P.r1&&P.r1>=HOY)?habilesEntre(HOY,P.r1):0;
  const venc=(P.r1&&P.r1<HOY);
  const listo = puedeFirmar(m) || P.firmada;

  /* ---------- etapa del proyecto ---------- */
  const HITOS=[['Sesiones de Prueba Funcional', ses.length?fmt(ses[0].fecha):'—', ses.length?fmt(ses[ses.length-1].fecha):'—',
                'El consultor mostró el proceso en el sistema y se registró qué funcionó y qué no.'],
               ['Prácticas del área', P.r0?fmt(P.r0):'—', P.r1?fmt(P.r1):'—',
                'El área repite el proceso por su cuenta, con órdenes reales, y deja constancia en la bitácora.'],
               ['Evaluación y acreditación', P.cierre?fmt(P.cierre):'—','',
                'Se revisa la bitácora, se cierran los faltantes bloqueantes y se libera el módulo.'],
               ['Pruebas Integrales', '15-sep','24-sep',
                'El proceso ya no se prueba solo: se prueba encadenado con las demás áreas, de punta a punta.']];
  const tablaEtapas=`<table cellspacing="0" style="width:100%">
    <tr>${['Etapa','Desde','Hasta','Qué ocurre en ella'].map(t=>
      `<td style="${B}background:${AZ};color:#FFF;font-size:9.5pt;font-weight:bold">${t}</td>`).join('')}</tr>
    ${HITOS.map((h,i)=>{const act=(ini?i===1:i===2);
      return `<tr>
      <td style="${B}font-size:10pt;${act?'background:#E8F5E9;font-weight:bold':''}">${h[0]}${act?' &nbsp;←&nbsp; <b>aquí estamos</b>':''}</td>
      <td style="${B}font-size:10pt;text-align:center">${h[1]}</td>
      <td style="${B}font-size:10pt;text-align:center">${h[2]||'—'}</td>
      <td style="${B}font-size:9.5pt">${h[3]}</td></tr>`}).join('')}
    </table>`;

  /* ---------- cuerpo de inicio ---------- */
  const cuerpoInicio = `
  ${caja(`<b style="font-size:12pt">Su proceso entra hoy a prácticas.</b><br>
    ${venc?`<b style="color:#C00000">La ventana venció el ${fmt(P.r1)}. Cada día que pasa sin capturar reduce lo que se puede corregir antes del arranque.</b>`
      :`Tiene <b>${dh||'—'} días hábiles</b> para completar <b>${nr} repeticiones</b>${rest?`, y quedan <b>${rest}</b>`:''}. 
        La ventana cierra el <b>${P.r1?fmt(P.r1):'—'}</b> y el acta de cierre se firma el <b>${P.cierre?fmt(P.cierre):'—'}</b>.`}`,
    venc?'#FCE4E4':'#FFF6E0', venc?'#C00000':'#FFC000')}

  ${H2('1. Dónde está el proyecto y dónde está usted')}
  ${p(`Este proceso ya pasó por <b>${ejec} de ${ses.length} sesiones de Prueba Funcional</b>, en las que se revisaron
     <b>${it.length} actividades</b> agrupadas en ${m.grupos.length} etapas. De ellas, <b>${conf} quedaron conformes</b>.
     Eso significa que el proceso ya se vio funcionando; lo que falta es que el área lo opere sin que nadie lo guíe.`)}
  ${tablaEtapas}
  ${p(`Las Pruebas Integrales del 15 al 24 de septiembre son la última prueba antes de operar. Ahí el proceso deja de estar
     solo: si algo no quedó claro aquí, se va a notar cuando otra área dependa de este resultado.`)}

  ${H2('2. El mecanismo: cómo funciona una práctica')}
  ${p(`Una práctica no es una capacitación ni una demostración. Es el área ejecutando el proceso completo en el sistema,
     con casos reales, y dejando registro de lo que pasó. El mecanismo tiene cinco piezas:`)}
  <table cellspacing="0" style="width:100%">
  ${fila('Qué es una repetición', `Un caso real completo, de principio a fin. Se toma una orden que ya existe, se replica en el sistema y se compara el resultado contra el original antes de confirmar.`)}
  ${fila('Cuántas se acordaron', `<b>${nr} repeticiones.</b> No son ${nr} clics: son ${nr} casos distintos, elegidos para cubrir las variantes reales del proceso, no las fáciles.`)}

  ${fila('Dónde se registra', `En la bitácora de casos del proceso. Cada renglón lleva el caso original, lo que generó el sistema, y qué difirió.`)}
  ${fila('Qué acredita la práctica', `Que las ${nr} repeticiones estén capturadas, que los faltantes bloqueantes estén cerrados y que haya evidencia adjunta. Sin las tres cosas el módulo no se acredita.`)}
  ${fila('Qué pasa si algo falla', `Se anota en la hoja de faltantes, se marca si bloquea y se clasifica. <b>Un caso que falla y queda documentado vale más que uno que se omitió.</b>`)}
  </table>

  ${H2('3. Qué le va a cambiar a su área')}
  ${p(`No todo cambia, y conviene saber qué sí. De lo que se revisó en las sesiones de este proceso, esto es lo que
     opera distinto a partir de ahora:`)}
  <ol style="${F}font-size:10.5pt;margin-top:0">
    ${cambiosDelProceso(m).map(t=>`<li style="margin-bottom:5px">${t}</li>`).join('')}
  </ol>
  ${p(`Hay dos clases de cambio y no cuestan lo mismo. El <b>cambio de forma</b> es el mismo trabajo en otra pantalla:
     se aprende en días. El <b>cambio de fondo</b> es cuando el sistema pide un dato o una decisión que antes no se
     tomaba, o la pide antes de lo acostumbrado. Ese es el que se siente incómodo, y es exactamente el que la práctica
     sirve para descubrir a tiempo.`)}

  ${H2('4. Lo que conviene traer puesto')}
  ${p(`Vale la pena decirlo con claridad: en las primeras repeticiones el proceso va a parecer más lento que hoy.
     Es normal y es temporal. Lo que se está construyendo no es velocidad, es que el dato quede una sola vez y sirva
     a las demás áreas.`)}
  <table cellspacing="0" style="width:100%">
  ${fila('Si algo no aparece donde esperaba','Probablemente esté, con otro nombre. Pregunte antes de asumir que falta: la mitad de los faltantes que se reportan resultan ser ubicación, no ausencia.')}
  ${fila('Si el sistema pide un dato que antes no se pedía','Anótelo. Puede ser una mejora real de control o una exigencia que sobra. Las dos cosas se corrigen, pero solo si quedan escritas.')}
  ${fila('Si el proceso cambió de secuencia','Pruébelo en el orden nuevo antes de pedir que se regrese al anterior. Muchas secuencias cambian por una razón que se ve más adelante en la cadena.')}
  ${fila('Si aparece algo que no estaba en el proceso','Regístrelo igual. Los procesos nuevos que surgen en la práctica son hallazgos, no errores del sistema.')}
  ${fila('Si se equivoca','No pasa nada. Este es el único momento del proyecto en que un error no le cuesta a un cliente.')}
  </table>

  ${H2('5. Los compromisos')}
  ${H3('Del área')}
  <ol style="${F}font-size:10.5pt;margin-top:0">
    <li>Elegir <b>${nr} casos reales</b> representativos de las líneas y variantes del proceso, no los más sencillos.</li>
    <li>Replicarlos completos en el sistema y comparar el resultado contra el original antes de confirmar.</li>
    <li>Registrar cada caso en la bitácora el mismo día en que se ejecuta, no al final de la ventana.</li>
    <li>Documentar en la hoja de faltantes todo lo que impidió o cambió el resultado, marcando si bloquea.</li>
    <li>Entregar la bitácora firmada con sus capturas el <b>${P.cierre?fmt(P.cierre):'—'}</b>.</li>
  </ol>
  ${H3('De Doer')}
  <ol style="${F}font-size:10.5pt;margin-top:0">
    <li>Acompañamiento durante toda la ventana, con respuesta el mismo día a dudas de captura.</li>
    <li>Clasificación y seguimiento de cada faltante, con dueño y fecha.</li>
    <li>Ajuste de configuración de lo que resulte mal parametrizado, sin esperar al cierre.</li>
    <li>Consolidación del resultado y presentación del proceso a la etapa de acreditación.</li>
  </ol>

  ${caja(`<b style="font-size:11.5pt;color:${AZ}">Por qué esto conviene al área, y no solo al proyecto</b><br>
    Esta es la única etapa en la que el área puede exigir cambios y ser escuchada con evidencia en la mano.
    Un faltante documentado en la práctica se corrige; el mismo faltante detectado después del arranque se
    convierte en una solicitud que compite con todas las demás. <b>Practicar es la oportunidad de dejar el proceso
    como el área lo necesita, no como quedó configurado.</b> Quien la aprovecha llega al arranque operando; quien
    la deja pasar llega aprendiendo.`, '#E8F5E9','#4CAF50')}

  ${caja(`<b>El reloj.</b> ${venc
      ? `La ventana de este proceso cerró el <b>${fmt(P.r1)}</b> y la bitácora sigue en <b>${nc} de ${nr}</b> casos.
         Cada día sin capturar acerca el arranque de las Pruebas Integrales con este módulo sin acreditar.`
      : `Quedan <b>${rest||dh||'—'} días hábiles</b> y la bitácora va en <b>${nc} de ${nr}</b> casos.
         Las Pruebas Integrales arrancan el <b>15 de septiembre</b> y no esperan: un módulo sin acreditar no entra
         a sus flujos, y los flujos de las otras áreas tampoco pueden probarse sin él.`}`,
    '#FBEAEA','#E06666','#7A2A2A')}`;

  /* ---------- cuerpo de cierre ---------- */
  const faltan = [];
  if(!(it.length>0 && it.every(i=>i.res==='HECHA'))) faltan.push(`actividades del proceso: ${conf} de ${it.length} en «Hecha»`);
  if(!metaOk(m)) faltan.push(`bitácora: ${nc} caso(s) de ${nr} repeticiones acordadas`);
  if(nBloq(m)>0) faltan.push(`${nBloq(m)} faltante(s) bloqueante(s) abierto(s)`);
  if(nEvi(m)===0) faltan.push('sin evidencia adjunta');
  const abiertos=(m.faltantes||[]).filter(f=>f.estatus!=='Resuelto');
  const cuerpoCierre = `
  ${(!listo)? caja(`<b>BORRADOR — este acta todavía no puede firmarse.</b><br>Falta: ${faltan.map(esc).join(' · ')}.`,
      '#FCE4E4','#C00000','#C00000') : caja(`<b>El proceso cumplió las condiciones de cierre.</b> Las ${nr} repeticiones
      están capturadas, no quedan faltantes bloqueantes abiertos y hay evidencia adjunta.`,'#E8F5E9','#4CAF50')}

  ${H2('1. Dónde queda el proceso')}
  ${p(`Con la firma de este documento concluye la etapa de prácticas de <b>${esc(m.proceso)}</b> e inicia la evaluación
     para habilitar el módulo hacia las Pruebas Integrales del 15 al 24 de septiembre.`)}
  ${tablaEtapas}

  ${H2('2. Resultado de la práctica')}
  <table cellspacing="0" style="width:100%">
  ${fila('Proceso · módulo', esc(m.proceso)+' · '+esc(m.modulo))}
  ${fila('Empresa', esc(m.empresa))}
  ${fila('Ventana ejecutada', `${P.r0?fmt(P.r0):'—'} al ${P.r1?fmt(P.r1):'—'}${dh?` · ${dh} días hábiles`:''}`)}
  ${fila('Repeticiones acordadas', String(nr))}
  ${fila('Casos registrados', `<b>${nc}</b>${nc>=nr?' — cumple la meta':' — <b style="color:#C00000">no cumple</b>'}`)}
  ${fila('Actividades conformes', `${conf} de ${it.length}`)}
  ${fila('Bitácora entregada', esc(P.bitNombre||'')||'<i>pendiente</i>')}
  ${fila('Evidencia adjunta', `${nEvi(m)} archivo(s)`)}
  ${fila('Faltantes detectados', `${(m.faltantes||[]).length} en total · ${nBloq(m)} bloqueante(s) abierto(s)`)}
  ${fila('Líder del área', esc(P.resp||'')||'<i>por definir</i>')}
  ${fila('Consultor que acompañó', esc(m.ficha.consultor||''))}
  </table>

  ${H2('3. Qué se adoptó y qué sigue costando')}
  ${p(`La práctica sirve para separar dos cosas que se confunden: lo que el área ya opera sin ayuda, y lo que todavía
     requiere que alguien esté al lado. De los cambios que traía este proceso:`)}
  <ol style="${F}font-size:10.5pt;margin-top:0">
    ${cambiosDelProceso(m).map(t=>`<li style="margin-bottom:5px">${t}</li>`).join('')}
  </ol>
  ${p(`Lo que quedó documentado como faltante es la mejor medida de qué tan a fondo se practicó.
     ${(m.faltantes||[]).length? `Este proceso reportó <b>${(m.faltantes||[]).length} faltante(s)</b>, de los cuales
     ${nBloq(m)} bloquean. Eso habla de una práctica que se metió al detalle.`
     : `Este proceso no reportó faltantes. Conviene revisar si es porque el proceso quedó limpio o porque la práctica
        no alcanzó a tocar las variantes difíciles.`}`)}

  ${abiertos.length? `${H2('4. Faltantes que quedan abiertos')}
    <table cellspacing="0" style="width:100%">
    <tr>${['Caso','Tipo','Elemento','¿Bloquea?','Área','Estatus'].map(t=>
      `<td style="${B}background:${AZ};color:#FFF;font-size:9pt;font-weight:bold">${t}</td>`).join('')}</tr>
    ${abiertos.map(f=>`<tr>
      <td style="${B}font-size:9pt">${esc(f.caso||'')}</td><td style="${B}font-size:9pt">${esc(f.tipo||'')}</td>
      <td style="${B}font-size:9pt">${esc(f.elem||'')}</td>
      <td style="${B}font-size:9pt;${f.bloquea==='Sí'?'background:#FCE4E4;font-weight:bold':''}">${esc(f.bloquea||'')}</td>
      <td style="${B}font-size:9pt">${esc(f.area||'')}</td><td style="${B}font-size:9pt">${esc(f.estatus||'')}</td></tr>`).join('')}

  <ol style="${F}font-size:10.5pt;margin-top:0">
    <li>Evaluación del resultado contra las actividades del proceso.</li>
    <li>Cierre de los faltantes bloqueantes abiertos, con área responsable y fecha.</li>
    <li>Liberación de las etapas del módulo y acreditación para Pruebas Integrales.</li>
    <li>Programación de los flujos integrales en los que participa este módulo.</li>
  </ol>

  ${caja(`<b style="font-size:11.5pt;color:${AZ}">Lo que el área se lleva</b><br>
    Al cerrar la práctica el proceso deja de ser algo que se está implementando y pasa a ser algo que el área opera.
    ${nc>=nr? `Las ${nr} repeticiones ejecutadas son la prueba de que el equipo ya puede sostenerlo sin acompañamiento.`
      : `Con ${nc} de ${nr} casos, parte de ese respaldo queda incompleto y el módulo llega a integrales con menos margen.`}
    Lo que se documentó aquí es lo que va a definir cómo opera esta área durante los próximos años.`,
    '#E8EDF6','#2E5496')}
  ${P.notas? p(`<b>Notas del cierre.</b> ${esc(P.notas)}`):''}`;

  const firmas=`<table cellspacing="0" style="width:100%;margin-top:30px">
    <tr>${['Por el área — '+(esc(P.resp||'nombre y firma')),'Por Doer — '+esc(m.ficha.consultor||''),'Dueño del proceso — nombre y firma']
      .map(t=>`<td style="${F}font-size:9pt;padding-top:46px;border-top:.5pt solid #000;width:33%">${t}</td>`).join('<td style="width:2%"></td>')}</tr></table>`;

  const titulo = ini ? 'Acta de Inicio de Prácticas'
    : 'Acta de Cierre de Prácticas e Inicio de Evaluación';
  const html=`<html xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8">
    <title>${titulo} — ${esc(m.proceso)}</title></head>
    <body style="${F}">
    <p style="${F}font-size:9.5pt;font-weight:bold;color:${AZ};margin:0">Proyecto Alpha · Odoo 18 · Doer Partners</p>
    <h1 style="${F}font-size:17pt;color:${AZ};margin:5px 0 2px">${titulo}${(!ini&&!listo)?' — BORRADOR':''}</h1>
    <p style="${F}font-size:10pt;font-style:italic;color:${AZM};margin:0 0 6px">${esc(m.proceso)} · ${esc(m.empresa)} · emitida el ${fmtLargo(hoyISO())}</p>
    <div style="border-bottom:1.5pt solid ${AZ};margin-bottom:14px"></div>
    ${(!ini&&listo)
      ? `<table width="100%" cellspacing="0" background="${TROFEO}"><tr><td>${cuerpoCierre}${firmas}</td></tr></table>`
      : `${ini?cuerpoInicio:cuerpoCierre}${firmas}`}
    <p style="${F}font-size:8.5pt;color:${GT};margin-top:24px;font-style:italic">Documento elaborado por ${esc(m.ficha.consultor||'Doer Partners')} · Doer Partners · ${fmtLargo(hoyISO())}</p>
    </body></html>`;
  const b=new Blob(['﻿'+html],{type:'application/msword;charset=utf-8'});
  const u=URL.createObjectURL(b), a=document.createElement('a');
  a.href=u; a.download=`${ini?'Acta_Inicio':(listo?'Acta_Cierre':'BORRADOR_Acta_Cierre')}_Practicas_${m.pf}_${m.proceso.replace(/[^A-Za-z0-9]+/g,'_')}.doc`;
  a.click(); URL.revokeObjectURL(u);
}


/* ================= REPORTE GENERAL · LISTADO + CRONOGRAMA =================
   Se genera desde los datos vivos del tablero, no desde un archivo aparte:
   lo que ves en pantalla es lo que baja. */
function reporteGeneral(){
  const L=[...MODS].sort((a,b)=> (a.modulo+a.pf).localeCompare(b.modulo+b.pf,'es'));
  const st='font-family:Arial;font-size:9pt;border:.5pt solid #BFBFBF;vertical-align:middle;';
  const th=(t,w)=>`<td style="${st}font-weight:bold;color:#FFFFFF;background:#1F3864;text-align:center${w?';width:'+w+'px':''}">${esc(t)}</td>`;
  /* --- días hábiles del programa, sin fines de semana ni feriados --- */
  const todas=MODS.flatMap(m=>m.sesiones.map(s=>s.fecha))
    .concat(MODS.map(m=>(m.pract||{}).r0).filter(Boolean))
    .concat(MODS.map(m=>(m.pract||{}).r1).filter(Boolean))
    .concat(MODS.map(m=>(m.pract||{}).cierre).filter(Boolean)).filter(Boolean).sort();

  if(todas.length){
    let c=d3(todas[0]); const fin=d3(todas[todas.length-1]);
    while(c<=fin){ const w=c.getDay(), iso=iso3(c);
      if(w!==0&&w!==6&&!FERIADOS.includes(iso)) DIAS.push(iso);
      c=new Date(c.getTime()+864e5); }
  }
  const IX={}; DIAS.forEach((d,i)=>IX[d]=i);
  const N=DIAS.length;

  let x=`<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="utf-8"></head><body>
   <table cellspacing="0"><colgroup>
   <col width="150"><col width="60"><col width="170"><col width="90"><col width="120"><col width="140">
   <col width="80"><col width="80"><col width="60"><col width="60">
   <col width="80"><col width="80"><col width="60"><col width="90"><col width="90">
   <col width="80"><col width="80"><col width="80"><col width="60">
   <col width="90"><col width="90"><col width="60"><col width="90"><col width="110"><col width="150"><col width="60"></colgroup>
   <tr><td colspan="26" bgcolor="#1F3864" style="${st}font-size:14pt;font-weight:bold;color:#FFFFFF;background-color:#1F3864;height:28px">
     &nbsp;PROYECTO ALPHA · Estado de pruebas, sesiones y prácticas por módulo</td></tr>

    const pct=(a,b)=>b? Math.round(a/b*100)+'%' : '';
    x+=`<tr>${c(m.modulo)}${c(m.pf,'center')}${c(m.proceso)}${c(m.empresa)}${c(m.ficha.consultor)}${c(P.resp||'')}
      ${c(it.length,'center')}${c(ok,'center')}${c(par,'center')}${c(pct(ok,it.length),'center')}

      ${c(P.r0?fmt(P.r0):'','center')}${c(P.r1?fmt(P.r1):'','center')}${c(P.r0&&P.r1?habilesEntre(P.r0,P.r1):'','center')}

      ${c(P.bitNombre || (nr?'pendiente':'—'))}${c((m.faltantes||[]).length,'center')}</tr>`;
  });
  const tc=(v,al)=>`<td bgcolor="#D9E2F3" style="${st}background-color:#D9E2F3;font-weight:bold;${al?'text-align:'+al+';':''}">${v===''?'':esc(String(v))}</td>`;

  /* --- cronograma básico --- */

   <tr><td colspan="26" bgcolor="#1F3864" style="${st}font-size:12pt;font-weight:bold;color:#FFFFFF;background-color:#1F3864;height:24px">

   <tr><td colspan="26" style="font-family:Arial;font-size:9pt;color:#595959">
     &nbsp;Solo días hábiles. El feriado del 16 de septiembre queda fuera.</td></tr>
