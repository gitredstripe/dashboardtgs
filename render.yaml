# Render Blueprint: Web Service (not a Static Site).
# Static sites cannot persist writes. This process serves the dashboard
# and stores one shared JSON snapshot on disk.
# https://render.com/docs/web-services
services:
  - type: web
    name: dashboardtgs
    runtime: node
    branch: main
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
