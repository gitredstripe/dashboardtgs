# Render Blueprint: Web Service (not a Static Site).
# Static sites cannot persist writes or git-push the snapshot.
# https://render.com/docs/web-services
services:
  - type: web
    name: dashboardtgs
    runtime: node
    branch: main
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: GITHUB_TOKEN
        sync: false
